ung feststellen.</p>\n<h3>3. Zulässige Nutzung</h3>\n<p>Nutzen Sie Monsei nicht, um Schadsoftware zu erstellen oder zu verbreiten, Systeme Dritter anzugreifen, Betrug zu begehen, die Rechte anderer Personen zu verletzen, rechtswidrige Inhalte zu erzeugen (einschließlich sexuellen Missbrauchs von Minderjährigen) oder die Nutzungsgrenzen zu umgehen. Wir können Konten sperren, die gegen diese Regeln verstoßen.</p>\n<h3>4. Antworten der KI</h3>\n<p>Die Antworten werden automatisch erzeugt und können Fehler oder veraltete Informationen enthalten. Sie ersetzen keine medizinische, rechtliche, finanzielle oder fachliche Beratung. Prüfen Sie wichtige Informationen in offiziellen Quellen.</p>\n<h3>5. Inhalte</h3>\n<p>Sie behalten die Rechte an den Inhalten, die Sie senden. Sie gewähren Monsei die erforderliche Lizenz, um Ihre Nachrichten zu verarbeiten und Ihren Verlauf anzuzeigen. Sie dürfen die erhaltenen Antworten verwenden, sofern dies dem Gesetz und den Rechten Dritter entspricht.</p>\n<h3>6. Geistiges Eigentum</h3>\n<p>Die Marke, das Logo und die Software von Monsei gehören [NOME DO RESPONSÁVEL]. Es ist untersagt, den Dienst zu kopieren, weiterzuverkaufen oder zurückzuentwickeln, sofern das Gesetz dies nicht erlaubt.</p>\n<h3>7. Haftung</h3>\n<p>Soweit gesetzlich zulässig, haften wir nicht für mittelbare Schäden, die aus der Verwendung der KI-Antworten entstehen. Nichts in diesen Bedingungen schränkt Ihre Rechte als Verbraucher nach dem Recht der Europäischen Union oder Ihres Wohnsitzlandes ein, ebenso wenig eine Haftung, die gesetzlich nicht ausgeschlossen werden kann, etwa für vorsätzlich oder grob fahrlässig verursachte Schäden oder Verletzungen an Leib und Leben.</p>\n<h3>8. Beendigung</h3>\n<p>Sie können die Nutzung von Monsei jederzeit beenden und die Löschung Ihres Kontos verlangen. Wir können den Zugang bei Verstößen gegen diese Bedingungen aussetzen.</p>\n<h3>9. Anwendbares Recht und Streitbeilegung</h3>\n<p>Diese Bedingungen unterliegen dem Recht Ihres gewöhnlichen Aufenthaltslandes, sofern Sie Verbraucher sind. In diesem Fall können Sie Klagen vor dem Gericht Ihres Wohnsitzes erheben. Die Europäische Kommission stellt eine Plattform zur Online-Streitbeilegung bereit: ec.europa.eu/consumers/odr.</p>\n<h3>10. Änderungen</h3>\n<p>Wir können diese Bedingungen aktualisieren. Wesentliche Änderungen teilen wir Ihnen vor Inkrafttreten mit.</p>\n<h3>11. Kontakt</h3>\n<p>[E-MAIL DE CONTATO]</p>"}, "geral": {"privacidade": "<h2>Datenschutzerklärung von Monsei (übrige Länder)</h2>\n<p>Letzte Aktualisierung: [DATA]</p>\n<p>Diese Erklärung beschreibt, wie Monsei Ihre personenbezogenen Daten erhebt, verwendet und schützt, gemäß den anwendbaren Datenschutzgesetzen, einschließlich des kalifornischen Gesetzes CCPA/CPRA (California Consumer Privacy Act / California Privacy Rights Act) und weiterer lokaler Gesetze.</p>\n<h3>1. Verantwortlicher</h3>\n<p>[NOME DO RESPONSÁVEL], [E-MAIL DE CONTATO].</p>\n<h3>2. Erhobene Daten</h3>\n<ul>\n<li>E-Mail-Adresse, um das Konto anzulegen und den Anmeldecode zu senden.</li>\n<li>Inhalt der Unterhaltungen, einschließlich des in der Cloud synchronisierten Verlaufs.</li>\n<li>Technische Daten wie Datum und Uhrzeit der Nutzung, Browsertyp und Nachrichtenzähler.</li>\n</ul>\n<p>Wir verkaufen keine personenbezogenen Daten und geben sie nicht für verhaltensbasierte Werbung weiter.</p>\n<h3>3. Verwendung der Daten</h3>\n<p>Wir verwenden Ihre Daten, um: Ihr Konto anzulegen und zu pflegen; Ihre Fragen zu beantworten und den Verlauf zu speichern; die Nutzung zu begrenzen und Missbrauch zu verhindern; gültige E-Mail-Adressen zu prüfen; gesetzliche Pflichten zu erfüllen.</p>\n<h3>4. Dienstleister</h3>\n<p>Wir setzen Supabase (Authentifizierung und Datenbank), Cloudflare (Worker und E-Mail-Prüfung), Hugging Face (KI-Modelle) und einen Anbieter für transaktionale E-Mails ein. Diese können Daten in anderen Ländern verarbeiten.</p>\n<h3>5. Speicherdauer</h3>\n<p>Unterhaltungen werden gespeichert, solange das Konto besteht, oder bis Sie diese löschen. Protokolle des Nutzungslimits werden innerhalb von zwei Stunden gelöscht. Kontodaten werden bis zu der von Ihnen gewünschten Löschung gespeichert.</p>\n<h3>6. Ihre Rechte</h3>\n<p>Je nach Wohnort können Sie Auskunft, Berichtigung, Löschung und eine Kopie Ihrer Daten verlangen sowie der Verarbeitung widersprechen. Einwohner Kaliforniens können erfahren, welche Daten wir erheben, und deren Löschung verlangen. Um Ihre Rechte auszuüben, schreiben Sie an [E-MAIL DE CONTATO]. Wir benachteiligen Sie nicht, weil Sie Ihre Rechte ausüben.</p>\n<h3>7. Kinder</h3>\n<p>Monsei richtet sich nicht an Personen unter 13 Jahren (oder unter dem nach lokalem Recht geforderten Mindestalter). Sollten wir erfahren, dass wir Daten eines Kindes ohne die erforderliche Zustimmung erhoben haben, löschen wir diese Daten.</p>\n<h3>8. Sicherheit</h3>\n<p>Wir verwenden HTTPS, benutzerbezogene Zugriffskontrollen und Sitzungstoken mit begrenzter Gültigkeit. Kein System ist vollständig sicher.</p>\n<h3>9. Änderungen</h3>\n<p>Wir veröffentlichen Änderungen auf der Website. Wesentliche Änderungen teilen wir Ihnen vor Inkrafttreten mit.</p>\n<h3>10. Kontakt</h3>\n<p>[E-MAIL DE CONTATO]</p>", "termos": "<h2>Nutzungsbedingungen von Monsei (übrige Länder)</h2>\n<p>Letzte Aktualisierung: [DATA]</p>\n<p>Mit der Nutzung von Monsei stimmen Sie diesen Bedingungen zu.</p>\n<h3>1. Der Dienst</h3>\n<p>Monsei bietet Zugang zu Modellen der künstlichen Intelligenz zum Chatten, zur Klärung von Fragen und zur Recherche von Informationen. Der Dienst kann sich ändern oder nicht verfügbar sein.</p>\n<h3>2. Konto</h3>\n<p>Sie melden sich mit Ihrer E-Mail-Adresse über einen Bestätigungscode an. Sie sind für alles verantwortlich, was über Ihr Konto geschieht.</p>\n<h3>3. Zulässige Nutzung</h3>\n<p>Nutzen Sie Monsei nicht, um Schadsoftware zu erstellen oder zu verbreiten, Systeme Dritter anzugreifen, Betrug zu begehen, die Rechte anderer Personen zu verletzen, rechtswidrige Inhalte zu erzeugen oder die Nutzungsgrenzen zu umgehen.</p>\n<h3>4. Antworten der KI</h3>\n<p>Die Antworten können Fehler enthalten oder veraltet sein und ersetzen keine medizinische, rechtliche, finanzielle oder fachliche Beratung. Prüfen Sie wichtige Informationen in offiziellen Quellen.</p>\n<h3>5. Inhalte</h3>\n<p>Sie behalten die Rechte an den Inhalten, die Sie senden, und gewähren Monsei die erforderliche Lizenz, um Ihre Nachrichten zu verarbeiten und Ihren Verlauf anzuzeigen. Sie dürfen die erhaltenen Antworten verwenden, sofern dies dem Gesetz und den Rechten Dritter entspricht.</p>\n<h3>6. Geistiges Eigentum</h3>\n<p>Die Marke, das Logo und die Software von Monsei gehören [NOME DO RESPONSÁVEL]. Es ist untersagt, den Dienst zu kopieren, weiterzuverkaufen oder zurückzuentwickeln, sofern das Gesetz dies nicht erlaubt.</p>\n<h3>7. Haftungsbeschränkung</h3>\n<p>Soweit gesetzlich zulässig, haftet Monsei nicht für mittelbare Schäden, die durch die Verwendung der KI-Antworten entstehen. Diese Klausel schränkt keine Verbraucherrechte ein, die das lokale Recht nicht ausschließen lässt.</p>\n<h3>8. Beendigung</h3>\n<p>Sie können die Nutzung von Monsei jederzeit beenden und die Löschung Ihres Kontos verlangen. Wir können den Zugang bei Verstößen gegen diese Bedingungen aussetzen.</p>\n<h3>9. Anwendbares Recht</h3>\n<p>Diese Bedingungen unterliegen den Gesetzen des Landes, in dem Sie wohnen. Streitigkeiten werden vor dem Gericht Ihres Wohnsitzes entschieden, unbeschadet der Verbraucherrechte, die Ihnen das lokale Recht garantiert.</p>\n<h3>10. Änderungen</h3>\n<p>Wir können diese Bedingungen aktualisieren. Wesentliche Änderungen teilen wir Ihnen vor Inkrafttreten mit.</p>\n<h3>11. Kontakt</h3>\n<p>[E-MAIL DE CONTATO]</p>"}}, "it": {"br": {"privacidade": "<h2>Informativa sulla privacy di Monsei (Brasile)</h2>\n<p>Ultimo aggiornamento: [DATA]</p>\n<p>La presente informativa spiega come Monsei raccoglie, utilizza, conserva e protegge i tuoi dati personali, in conformità alla Lei Geral de Proteção de Dados (LGPD, legge generale brasiliana sulla protezione dei dati personali, Lei nº 13.709/2018).</p>\n<h3>1. Titolare del trattamento</h3>\n<p>Il titolare del trattamento dei dati è [NOME DO RESPONSÁVEL]. Indirizzo e-mail di contatto: [E-MAIL DE CONTATO].</p>\n<h3>2. Dati che raccogliamo</h3>\n<ul>\n<li><strong>Dati dell&#x27;account:</strong> indirizzo e-mail, utilizzato per accedere a Monsei tramite codice di verifica.</li>\n<li><strong>Contenuto delle conversazioni:</strong> le domande che invii e le risposte che ricevi, incluse le conversazioni sincronizzate nel cloud.</li>\n<li><strong>Dati tecnici:</strong> data e ora di utilizzo, tipo di browser o dispositivo e conteggio dei messaggi, utilizzato per limitare l&#x27;uso orario.</li>\n</ul>\n<p>Non richiediamo il CPF, dati di pagamento né dati sensibili, e ti chiediamo di non inviare questo tipo di dati nelle conversazioni.</p>\n<h3>3. Finalità del trattamento e base giuridica (LGPD, art. 7º)</h3>\n<div class='tbl'><table>\n<tr><th>Finalità</th><th>Base giuridica (LGPD, art. 7º)</th></tr>\n<tr><td>Creare e mantenere il tuo account e inviare il codice di accesso</td><td>Esecuzione di un contratto</td></tr>\n<tr><td>Rispondere alle tue domande e conservare la cronologia</td><td>Esecuzione di un contratto</td></tr>\n<tr><td>Limitare l&#x27;uso orario e prevenire abusi</td><td>Legittimo interesse</td></tr>\n<tr><td>Verificare che l&#x27;e-mail sia valida e non sia un indirizzo usa e getta</td><td>Legittimo interesse</td></tr>\n<tr><td>Gestire le richieste relative ai diritti e le eventuali segnalazioni</td><td>Adempimento di un obbligo di legge</td></tr>\n</table></div>\n<h3>4. Destinatari dei dati (responsabili del trattamento)</h3>\n<p>Ci avvaliamo di fornitori che trattano dati per nostro conto:</p>\n<ul>\n<li><strong>Supabase:</strong> autenticazione tramite e-mail e archiviazione della cronologia.</li>\n<li><strong>Cloudflare:</strong> Worker che collega il sito ai modelli e verifica del dominio di posta elettronica.</li>\n<li><strong>Hugging Face:</strong> hosting dei modelli di intelligenza artificiale che elaborano le domande.</li>\n<li><strong>Fornitore di posta transazionale:</strong> invio del codice di accesso.</li>\n</ul>\n<p>Questi fornitori possono trattare dati al di fuori del Brasile. In tali casi adottiamo clausole contrattuali e garanzie adeguate, ai sensi dell&#x27;art. 33 della LGPD.</p>\n<p>Non vendiamo dati personali.</p>\n<h3>5. Per quanto tempo conserviamo i dati</h3>\n<ul>\n<li>Conversazioni: finché l&#x27;account esiste, oppure fino a quando le elimini.</li>\n<li>Registri di utilizzo orario: fino a due ore, dopodiché vengono cancellati automaticamente.</li>\n<li>Dati dell&#x27;account: fino a tua richiesta di cancellazione o allo scadere del termine di conservazione previsto dalla legge.</li>\n</ul>\n<h3>6. I tuoi diritti (art. 18 della LGPD)</h3>\n<p>Puoi chiedere la conferma del trattamento, l&#x27;accesso, la rettifica, l&#x27;anonimizzazione, la portabilità, la cancellazione dei dati, informazioni sulla condivisione e la revoca del consenso. Per farlo, scrivi a [E-MAIL DE CONTATO]. Risponderemo entro 15 giorni.</p>\n<p>Puoi inoltre presentare reclamo all&#x27;Autoridade Nacional de Proteção de Dados (ANPD, Autorità nazionale brasiliana per la protezione dei dati).</p>\n<h3>7. Minori</h3>\n<p>Monsei non è destinato a persone di età inferiore a 18 anni senza l&#x27;autorizzazione di un tutore legale, ai sensi dell&#x27;Estatuto da Criança e do Adolescente (ECA, Statuto del bambino e dell&#x27;adolescente, legge brasiliana a tutela dei minori). Se venissimo a sapere di aver raccolto dati di un minore senza tale autorizzazione, li cancelleremo.</p>\n<h3>8. Sicurezza</h3>\n<p>Utilizziamo la crittografia in transito (HTTPS), un controllo degli accessi per utente nel database e token di sessione a validità limitata. Nessun sistema è completamente sicuro, per questo ti consigliamo una password robusta per la tua e-mail e l&#x27;uso della verifica in due passaggi.</p>\n<h3>9. Modifiche</h3>\n<p>Quando la presente informativa cambia, lo comunicheremo sul sito. Le modifiche rilevanti ti saranno comunicate con anticipo.</p>", "termos": "<h2>Termini di uso di Monsei (Brasile)</h2>\n<p>Ultimo aggiornamento: [DATA]</p>\n<p>Utilizzando Monsei, accetti i presenti termini. Se non li accetti, non utilizzare il servizio.</p>\n<h3>1. Il servizio</h3>\n<p>Monsei offre accesso a modelli di intelligenza artificiale per conversare, chiarire dubbi e ricercare informazioni. Il servizio può cambiare, essere limitato o restare temporaneamente non disponibile.</p>\n<h3>2. Account e accesso</h3>\n<p>Accedi con il tuo indirizzo e-mail, tramite un codice di verifica. Sei responsabile di ciò che avviene nel tuo account e devi avvisare [E-MAIL DE CONTATO] se noti un uso non autorizzato.</p>\n<h3>3. Uso accettabile</h3>\n<p>Accetti di non utilizzare Monsei per:</p>\n<ul>\n<li>creare, distribuire o migliorare malware, attacchi contro sistemi di terzi o frodi;</li>\n<li>violare i diritti di altre persone, inclusi quelli di privacy e di proprietà intellettuale;</li>\n<li>generare contenuti illegali, di sfruttamento sessuale minorile o che incitino alla violenza;</li>\n<li>sovraccaricare il servizio, aggirare i limiti di utilizzo o tentare di accedere al sistema con mezzi non autorizzati.</li>\n</ul>\n<p>Possiamo sospendere gli account che violano queste regole.</p>\n<h3>4. Risposte dell&#x27;IA</h3>\n<p>Le risposte sono generate automaticamente e possono contenere errori, informazioni non aggiornate o affermazioni inesatte. Non sostituiscono una consulenza medica, legale, finanziaria o professionale. Verifica le informazioni importanti presso fonti ufficiali prima di prendere decisioni.</p>\n<h3>5. Contenuti che invii e ricevi</h3>\n<p>Mantieni i diritti su ciò che invii. Concedi a Monsei la licenza necessaria per elaborare i tuoi messaggi e conservarli per mostrarti la cronologia.</p>\n<p>Puoi utilizzare le risposte ricevute, anche a fini commerciali, nel rispetto della legge e dei diritti di terzi.</p>\n<h3>6. Proprietà di Monsei</h3>\n<p>Il sito, il marchio, il logo e i modelli appartengono a [NOME DO RESPONSÁVEL]. Non è consentito copiare, rivendere o sottoporre a ingegneria inversa il servizio, salvo nei casi in cui la legge lo consenta.</p>\n<h3>7. Limitazione di responsabilità</h3>\n<p>Nei limiti consentiti dalla legge, Monsei non risponde dei danni indiretti causati dall&#x27;uso delle risposte dell&#x27;IA. La presente clausola non limita i diritti garantiti dal Código de Defesa do Consumidor (Codice di difesa del consumatore brasiliano), che non possono essere esclusi per contratto.</p>\n<h3>8. Cessazione</h3>\n<p>Puoi smettere di utilizzare Monsei e chiedere la cancellazione dell&#x27;account in qualsiasi momento. Possiamo interrompere o sospendere l&#x27;accesso in caso di violazione dei presenti termini.</p>\n<h3>9. Legge applicabile e foro competente</h3>\n<p>I presenti termini sono regolati dalla legge brasiliana. Viene eletto il foro del domicilio del consumatore, ai sensi del Código de Defesa do Consumidor.</p>\n<h3>10. Modifiche</h3>\n<p>Possiamo aggiornare i presenti termini. Quando la modifica è rilevante, la comunicheremo sul sito prima che diventi efficace.</p>\n<h3>11. Contatti</h3>\n<p>[E-MAIL DE CONTATO]</p>"}, "eu": {"privacidade": "<h2>Informativa sulla privacy di Monsei (Unione Europea / SEE)</h2>\n<p>Ultimo aggiornamento: [DATA]</p>\n<p>La presente informativa spiega come Monsei tratta i tuoi dati personali, in conformità al Regolamento generale sulla protezione dei dati (RGPD / GDPR, Regolamento (UE) 2016/679).</p>\n<h3>1. Titolare del trattamento</h3>\n<p>[NOME DO RESPONSÁVEL], [E-MAIL DE CONTATO]. Rappresentante nell&#x27;UE (ove applicabile): [NOME E CONTATO]. Responsabile della protezione dei dati: [NOME E CONTATO].</p>\n<h3>2. Dati che trattiamo</h3>\n<ul>\n<li>Indirizzo e-mail, per creare l&#x27;account e inviare il codice di accesso.</li>\n<li>Contenuto delle conversazioni, incluse la cronologia sincronizzata nel cloud.</li>\n<li>Dati tecnici, come data e ora di utilizzo, tipo di browser e conteggio dei messaggi, per limitare l&#x27;uso orario.</li>\n</ul>\n<p>Non trattiamo categorie particolari di dati (art. 9 del GDPR). Ti chiediamo di non inviarle nelle conversazioni.</p>\n<h3>3. Finalità e basi giuridiche (art. 6)</h3>\n<div class='tbl'><table>\n<tr><th>Finalità</th><th>Base giuridica</th></tr>\n<tr><td>Creare l&#x27;account e autenticare l&#x27;accesso</td><td>Esecuzione di un contratto (art. 6, par. 1, lett. b)</td></tr>\n<tr><td>Rispondere alle domande e conservare la cronologia</td><td>Esecuzione di un contratto (art. 6, par. 1, lett. b)</td></tr>\n<tr><td>Limitare l&#x27;uso orario e prevenire abusi</td><td>Legittimo interesse (art. 6, par. 1, lett. f)</td></tr>\n<tr><td>Verificare che l&#x27;e-mail esista e non sia un indirizzo usa e getta</td><td>Legittimo interesse (art. 6, par. 1, lett. f)</td></tr>\n<tr><td>Adempiere agli obblighi di legge</td><td>Obbligo legale (art. 6, par. 1, lett. c)</td></tr>\n</table></div>\n<h3>4. Destinatari e trasferimenti internazionali</h3>\n<p>Ci avvaliamo di responsabili del trattamento per erogare il servizio: Supabase (autenticazione e database), Cloudflare (Worker e verifica del dominio), Hugging Face (modelli di intelligenza artificiale) e un fornitore di posta transazionale. Alcuni possono trovarsi al di fuori dello Spazio Economico Europeo. In tali casi utilizziamo le clausole contrattuali tipo approvate dalla Commissione europea e, quando necessario, misure supplementari.</p>\n<p>Non vendiamo dati personali.</p>\n<h3>5. Periodi di conservazione</h3>\n<ul>\n<li>Conversazioni: finché l&#x27;account esiste, oppure fino a quando le elimini.</li>\n<li>Registri del limite di utilizzo: fino a due ore.</li>\n<li>Dati dell&#x27;account: fino alla cancellazione richiesta, nel rispetto dei termini di legge.</li>\n</ul>\n<h3>6. I tuoi diritti (artt. 15-22)</h3>\n<p>Hai diritto di accesso, rettifica, cancellazione, limitazione del trattamento, portabilità, opposizione e di non essere sottoposto a decisioni basate unicamente su un trattamento automatizzato che produca effetti giuridici significativi. Puoi revocare il consenso in qualsiasi momento, quando il trattamento si basa su di esso.</p>\n<p>Per esercitare i tuoi diritti, scrivi a [E-MAIL DE CONTATO]. Risponderemo entro un mese, prorogabile nei termini previsti dal regolamento.</p>\n<p>Puoi inoltre proporre reclamo all&#x27;autorità di controllo del paese di tua residenza abituale.</p>\n<h3>7. Età minima</h3>\n<p>Il servizio non è destinato a minori di età inferiore all&#x27;età del consenso digitale del tuo paese (tra i 13 e i 16 anni, secondo la legislazione nazionale). Se venissimo a sapere di aver raccolto dati di un minore senza la necessaria autorizzazione, li cancelleremo.</p>\n<h3>8. Sicurezza</h3>\n<p>Adottiamo misure tecniche e organizzative adeguate, come la crittografia in transito (HTTPS), un controllo degli accessi per utente nel database e token di sessione a validità limitata.</p>\n<h3>9. Modifiche</h3>\n<p>Quando la presente informativa cambia, pubblicheremo la nuova versione sul sito e, se la modifica è rilevante, ti avviseremo prima che diventi efficace.</p>", "termos": "<h2>Termini di uso di Monsei (Unione Europea / SEE)</h2>\n<p>Ultimo aggiornamento: [DATA]</p>\n<p>Utilizzando Monsei, accetti i presenti termini.</p>\n<h3>1. Il servizio</h3>\n<p>Monsei offre accesso a modelli di intelligenza artificiale per conversare, chiarire dubbi e ricercare informazioni. Il servizio può cambiare o restare temporaneamente non disponibile.</p>\n<h3>2. Account</h3>\n<p>Accedi con il tuo indirizzo e-mail, tramite codice di verifica. Mantieni sicuro il tuo accesso e avvisa [E-MAIL DE CONTATO] se noti un uso non autorizzato.</p>\n<h3>3. Uso accettabile</h3>\n<p>Non utilizzare Monsei per creare o distribuire malware, attaccare sistemi di terzi, commettere frodi, violare i diritti di altre persone, generare contenuti illegali (incluso l&#x27;abuso sessuale di minori) o aggirare i limiti di utilizzo. Possiamo sospendere gli account che violano queste regole.</p>\n<h3>4. Risposte dell&#x27;IA</h3>\n<p>Le risposte sono generate automaticamente e possono contenere errori o informazioni non aggiornate. Non sostituiscono una consulenza medica, legale, finanziaria o professionale. Verifica le informazioni importanti presso fonti ufficiali.</p>\n<h3>5. Contenuti</h3>\n<p>Mantieni i diritti su ciò che invii. Concedi a Monsei la licenza necessaria per elaborare i tuoi messaggi e visualizzare la tua cronologia. Puoi utilizzare le risposte ricevute, nel rispetto della legge e dei diritti di terzi.</p>\n<h3>6. Proprietà intellettuale</h3>\n<p>Il marchio, il logo e il software di Monsei appartengono a [NOME DO RESPONSÁVEL]. Non è consentito copiare, rivendere o sottoporre a ingegneria inversa, salvo quando la legge lo consenta.</p>\n<h3>7. Responsabilità</h3>\n<p>Nei limiti consentiti dalla legge, non rispondiamo dei danni indiretti derivanti dall&#x27;uso delle risposte dell&#x27;IA. Nulla nei presenti termini limita i diritti che hai in qualità di consumatore ai sensi della normativa dell&#x27;Unione europea o del tuo paese di residenza, né la responsabilità che la legge non consente di escludere, come i danni causati con dolo o colpa grave o le lesioni alla persona.</p>\n<h3>8. Cessazione</h3>\n<p>Puoi smettere di utilizzare Monsei e chiedere la cancellazione dell&#x27;account in qualsiasi momento. Possiamo sospendere l&#x27;accesso in caso di violazione dei presenti termini.</p>\n<h3>9. Legge applicabile e risoluzione delle controversie</h3>\n<p>I presenti termini sono regolati dalla legge del tuo paese di residenza abituale, qualora tu sia un consumatore. In tal caso puoi proporre azioni dinanzi al tribunale del tuo domicilio. La Commissione europea mette a disposizione una piattaforma per la risoluzione online delle controversie all&#x27;indirizzo ec.europa.eu/consumers/odr.</p>\n<h3>10. Modifiche</h3>\n<p>Possiamo aggiornare i presenti termini. Le modifiche rilevanti ti saranno comunicate prima di entrare in vigore.</p>\n<h3>11. Contatti</h3>\n<p>[E-MAIL DE CONTATO]</p>"}, "geral": {"privacidade": "<h2>Informativa sulla privacy di Monsei (altri paesi)</h2>\n<p>Ultimo aggiornamento: [DATA]</p>\n<p>La presente informativa spiega come Monsei raccoglie, utilizza e protegge i tuoi dati personali, in conformità alle leggi applicabili in materia di privacy, incluse quelle della California (CCPA/CPRA, California Consumer Privacy Act / California Privacy Rights Act, leggi sulla privacy dei consumatori della California) e altre leggi locali.</p>\n<h3>1. Titolare</h3>\n<p>[NOME DO RESPONSÁVEL], [E-MAIL DE CONTATO].</p>\n<h3>2. Dati raccolti</h3>\n<ul>\n<li>E-mail, per creare l&#x27;account e inviare il codice di accesso.</li>\n<li>Contenuto delle conversazioni, incluse la cronologia sincronizzata nel cloud.</li>\n<li>Dati tecnici, come data e ora di utilizzo, tipo di browser e conteggio dei messaggi.</li>\n</ul>\n<p>Non vendiamo dati personali e non li condividiamo a fini di pubblicità comportamentale.</p>\n<h3>3. Utilizzo dei dati</h3>\n<p>Utilizziamo i tuoi dati per: creare e mantenere il tuo account; rispondere alle domande e conservare la cronologia; limitare l&#x27;uso e prevenire abusi; verificare la validità delle e-mail; adempiere agli obblighi di legge.</p>\n<h3>4. Fornitori</h3>\n<p>Utilizziamo Supabase (autenticazione e database), Cloudflare (Worker e verifica e-mail), Hugging Face (modelli di intelligenza artificiale) e un fornitore di posta transazionale. Questi possono trattare dati in altri paesi.</p>\n<h3>5. Conservazione</h3>\n<p>Le conversazioni sono conservate finché l&#x27;account esiste, oppure fino a quando le elimini. I registri del limite di utilizzo vengono cancellati entro due ore. I dati dell&#x27;account sono conservati fino alla cancellazione richiesta.</p>\n<h3>6. I tuoi diritti</h3>\n<p>A seconda del luogo in cui vivi, puoi chiedere accesso, rettifica, cancellazione e copia dei tuoi dati, nonché opporti al trattamento. I residenti in California possono sapere quali dati raccogliamo e chiederne la cancellazione. Per esercitare i tuoi diritti, scrivi a [E-MAIL DE CONTATO]. Non ti discrimineremo per aver esercitato tali diritti.</p>\n<h3>7. Minori</h3>\n<p>Monsei non è destinato a minori di 13 anni (o all&#x27;età minima richiesta dalla legge locale). Se venissimo a sapere di aver raccolto dati di un bambino senza la necessaria autorizzazione, cancelleremo tali dati.</p>\n<h3>8. Sicurezza</h3>\n<p>Utilizziamo HTTPS, un controllo degli accessi per utente e token di sessione a validità limitata. Nessun sistema è completamente sicuro.</p>\n<h3>9. Modifiche</h3>\n<p>Pubblicheremo le modifiche sul sito. Le modifiche rilevanti ti saranno comunicate prima di entrare in vigore.</p>\n<h3>10. Contatti</h3>\n<p>[E-MAIL DE CONTATO]</p>", "termos": "<h2>Termini di uso di Monsei (altri paesi)</h2>\n<p>Ultimo aggiornamento: [DATA]</p>\n<p>Utilizzando Monsei, accetti i presenti termini.</p>\n<h3>1. Il servizio</h3>\n<p>Monsei offre accesso a modelli di intelligenza artificiale per conversare, chiarire dubbi e ricercare informazioni. Il servizio può cambiare o non essere disponibile.</p>\n<h3>2. Account</h3>\n<p>Accedi con il tuo indirizzo e-mail, tramite codice di verifica. Sei responsabile di ciò che avviene nel tuo account.</p>\n<h3>3. Uso accettabile</h3>\n<p>Non utilizzare Monsei per creare o distribuire malware, attaccare sistemi di terzi, commettere frodi, violare i diritti di altre persone, generare contenuti illegali o aggirare i limiti di utilizzo.</p>\n<h3>4. Risposte dell&#x27;IA</h3>\n<p>Le risposte possono contenere errori o essere non aggiornate e non sostituiscono una consulenza medica, legale, finanziaria o professionale. Verifica le informazioni importanti presso fonti ufficiali.</p>\n<h3>5. Contenuti</h3>\n<p>Mantieni i diritti su ciò che invii e concedi a Monsei la licenza necessaria per elaborare i tuoi messaggi e visualizzare la tua cronologia. Puoi utilizzare le risposte ricevute, nel rispetto della legge e dei diritti di terzi.</p>\n<h3>6. Proprietà intellettuale</h3>\n<p>Il marchio, il logo e il software di Monsei appartengono a [NOME DO RESPONSÁVEL]. Non è consentito copiare, rivendere o sottoporre a ingegneria inversa, salvo quando la legge lo consenta.</p>\n<h3>7. Limitazione di responsabilità</h3>\n<p>Nei limiti consentiti dalla legge, Monsei non risponde dei danni indiretti derivanti dall&#x27;uso delle risposte dell&#x27;IA. La presente clausola non limita i diritti del consumatore che la legge locale non consente di escludere.</p>\n<h3>8. Cessazione</h3>\n<p>Puoi smettere di utilizzare Monsei e chiedere la cancellazione dell&#x27;account in qualsiasi momento. Possiamo sospendere l&#x27;accesso in caso di violazione dei presenti termini.</p>\n<h3>9. Legge applicabile</h3>\n<p>I presenti termini sono regolati dalle leggi del paese in cui risiedi. Le controversie saranno risolte dinanzi al foro del tuo domicilio, fatti salvi i diritti che la legge locale riconosce al consumatore.</p>\n<h3>10. Modifiche</h3>\n<p>Possiamo aggiornare i presenti termini. Le modifiche rilevanti ti saranno comunicate prima di entrare in vigore.</p>\n<h3>11. Contatti</h3>\n<p>[E-MAIL DE CONTATO]</p>"}}, "ja": {"br": {"privacidade": "<h2>Monsei プライバシーポリシー（ブラジル）</h2>\n<p>最終更新日: [DATA]</p>\n<p>本ポリシーは、Monsei がお客様の個人データをどのように収集、利用、保管、保護するかを説明するものであり、ブラジル一般データ保護法（LGPD、第13.709/2018号。ブラジルの個人データ保護に関する法律）に準拠しています。</p>\n<h3>1. データ管理者</h3>\n<p>データ管理者は [NOME DO RESPONSÁVEL] です。連絡先メールアドレス: [E-MAIL DE CONTATO]。</p>\n<h3>2. 収集するデータ</h3>\n<ul>\n<li><strong>アカウントデータ:</strong> 認証コードによる Monsei へのログインに使用するメールアドレス。</li>\n<li><strong>会話の内容:</strong> お客様が送信する質問と受け取る回答（クラウドに同期された会話を含みます）。</li>\n<li><strong>技術データ:</strong> 利用日時、ブラウザまたは端末の種類、および時間あたりの利用を制限するために使用するメッセージ数。</li>\n</ul>\n<p>個人納税者番号、支払いデータおよび機微データは収集しません。また、会話においてこの種のデータを送信しないようお願いします。</p>\n<h3>3. データの利用目的および法的根拠</h3>\n<div class='tbl'><table>\n<tr><th>目的</th><th>法的根拠（LGPD 第7条）</th></tr>\n<tr><td>お客様のアカウントの作成・維持およびログインコードの送信</td><td>契約の履行</td></tr>\n<tr><td>ご質問への回答および履歴の保存</td><td>契約の履行</td></tr>\n<tr><td>時間あたりの利用制限および不正利用の防止</td><td>正当な利益</td></tr>\n<tr><td>メールアドレスが有効かつ使い捨てではないことの確認</td><td>正当な利益</td></tr>\n<tr><td>権利行使の請求および通報への対応</td><td>法的義務の遵守</td></tr>\n</table></div>\n<h3>4. データの受領者（処理者）</h3>\n<p>お客様に代わってデータを処理する以下の事業者を利用しています。</p>\n<ul>\n<li><strong>Supabase:</strong> メール認証および履歴の保存。</li>\n<li><strong>Cloudflare:</strong> サイトとモデルの間を仲介する Worker、およびメールドメインの検証。</li>\n<li><strong>Hugging Face:</strong> ご質問を処理する AI モデルのホスティング。</li>\n<li><strong>トランザクションメールプロバイダー:</strong> ログインコードの送信。</li>\n</ul>\n<p>これらの事業者は、ブラジル国外でデータを処理する場合があります。その場合、LGPD 第33条に従い、契約上の条項および適切な保証措置を講じています。</p>\n<p>当社は個人データを販売しません。</p>\n<h3>5. 保存期間</h3>\n<ul>\n<li>会話: アカウントが存在する間、またはお客様が削除するまで。</li>\n<li>時間あたりの利用記録: 最長2時間。その後自動的に削除されます。</li>\n<li>アカウントデータ: お客様が削除を請求するまで、または法定の保存期間の経過後まで。</li>\n</ul>\n<h3>6. お客様の権利（LGPD 第18条）</h3>\n<p>お客様は、取扱いの確認、アクセス、訂正、匿名化、ポータビリティ、データの削除、共有先に関する情報の提供、および同意の撤回を請求することができます。これらを請求する場合は [E-MAIL DE CONTATO] までご連絡ください。15日以内に回答します。</p>\n<p>お客様は、国家データ保護庁（ANPD）に苦情を申し立てることもできます。</p>\n<h3>7. 児童および青少年</h3>\n<p>Monsei は、児童・青少年に関する法律である児童・青少年法（Estatuto da Criança e do Adolescente、児童および青少年の権利を定めたブラジルの法律）に基づき、法定代理人の許可がない限り18歳未満の方を対象としていません。法定代理人の許可なく未成年者のデータを収集したことが判明した場合、当該データを削除します。</p>\n<h3>8. セキュリティ</h3>\n<p>通信中の暗号化（HTTPS）、データベースにおけるユーザー別のアクセス制御、有効期間が限定されたセッショントークンを使用しています。いかなるシステムも完全に安全ではないため、強力なメールパスワードの設定および二段階認証の利用をお勧めします。</p>\n<h3>9. 変更</h3>\n<p>本ポリシーを変更する場合は、サイト上で告知します。重要な変更については、事前にお知らせします。</p>", "termos": "<h2>Monsei 利用規約（ブラジル）</h2>\n<p>最終更新日: [DATA]</p>\n<p>Monsei をご利用になることにより、お客様は本規約に同意したものとみなされます。同意いただけない場合は、本サービスをご利用にならないでください。</p>\n<h3>1. 本サービス</h3>\n<p>Monsei は、会話、質問への回答、および情報の調査を行うための人工知能モデルへのアクセスを提供します。本サービスは変更、制限、または一時的に利用できなくなる場合があります。</p>\n<h3>2. アカウントおよびアクセス</h3>\n<p>お客様は、認証コードを使用してメールアドレスによりログインします。お客様は、ご自身のアカウントで行われたすべての行為について責任を負うものとし、不正な利用に気付いた場合 ]. Адрес электронной почты для связи: [E-MAIL DE CONTATO].</p>\n<h3>2. Какие данные мы собираем</h3>\n<ul>\n<li><strong>Данные учетной записи:</strong> адрес электронной почты, который используется для входа в Monsei с помощью проверочного кода.</li>\n<li><strong>Содержание диалогов:</strong> вопросы, которые вы отправляете, и ответы, которые получаете, включая диалоги, синхронизированные в облаке.</li>\n<li><strong>Технические данные:</strong> дата и время использования, тип браузера или устройства и количество сообщений, которое используется для ограничения использования в час.</li>\n</ul>\n<p>Мы не запрашиваем ИНН (CPF), платежные данные или чувствительные персональные данные и просим вас не отправлять такие данные в диалогах.</p>\n<h3>3. Цели использования данных и правовое основание</h3>\n<div class='tbl'><table>\n<tr><th>Цель</th><th>Правовое основание (LGPD, ст. 7)</th></tr>\n<tr><td>Создание и поддержка вашей учетной записи, отправка кода для входа</td><td>Исполнение договора</td></tr>\n<tr><td>Ответы на ваши вопросы и хранение истории</td><td>Исполнение договора</td></tr>\n<tr><td>Ограничение использования в час и предотвращение злоупотреблений</td><td>Законный интерес</td></tr>\n<tr><td>Проверка того, что адрес электронной почты действителен и не является одноразовым</td><td>Законный интерес</td></tr>\n<tr><td>Рассмотрение обращений по правам субъектов и жалоб</td><td>Выполнение законной обязанности</td></tr>\n</table></div>\n<h3>4. Кто получает данные (операторы)</h3>\n<p>Мы привлекаем поставщиков, которые обрабатывают данные от нашего имени:</p>\n<ul>\n<li><strong>Supabase:</strong> аутентификация по электронной почте и хранение истории.</li>\n<li><strong>Cloudflare:</strong> Worker, который связывает сайт с моделями, и проверка доменов электронной почты.</li>\n<li><strong>Hugging Face:</strong> размещение моделей ИИ, которые обрабатывают вопросы.</li>\n<li><strong>Поставщик транзакционной электронной почты:</strong> отправка кода для входа.</li>\n</ul>\n<p>Эти поставщики могут обрабатывать данные за пределами Бразилии. В таких случаях мы применяем стандартные контрактные условия и надлежащие гарантии в соответствии со ст. 33 LGPD.</p>\n<p>Мы не продаем персональные данные.</p>\n<h3>5. Сроки хранения</h3>\n<ul>\n<li>Диалоги: пока существует учетная запись или пока вы их не удалите.</li>\n<li>Записи об использовании в час: до двух часов, после чего автоматически удаляются.</li>\n<li>Данные учетной записи: до вашего запроса на удаление или до истечения законного срока хранения.</li>\n</ul>\n<h3>6. Ваши права (ст. 18 LGPD)</h3>\n<p>Вы можете запросить подтверждение обработки, доступ, исправление, анонимизацию, переносимость, удаление данных, информацию о передаче данных третьим лицам и отзыв согласия. Для этого напишите на адрес [E-MAIL DE CONTATO]. Мы ответим в течение 15 дней.</p>\n<p>Вы также можете подать жалобу в Национальное управление по защите персональных данных (ANPD).</p>\n<h3>7. Дети и подростки</h3>\n<p>Monsei не предназначен для лиц младше 18 лет без разрешения законного представителя в соответствии с Законом о защите детей и подростков (Estatuto da Criança e do Adolescente, ECA, Бразилия). Если мы узнаем, что собрали данные несовершеннолетнего без такого разрешения, мы удалим эти данные.</p>\n<h3>8. Безопасность</h3>\n<p>Мы используем шифрование при передаче данных (HTTPS), контроль доступа к базе данных для каждого пользователя и сеансовые токены ограниченного срока действия. Ни одна система не является полностью защищенной, поэтому мы рекомендуем использовать надежный пароль к электронной почте и двухэтапную проверку.</p>\n<h3>9. Изменения</h3>\n<p>Об изменениях настоящей политики мы сообщим на сайте. Существенные изменения будут доведены до вашего сведения заблаговременно.</p>", "termos": "<h2>Условия использования Monsei (Бразилия)</h2>\n<p>Дата последнего обновления: [DATA]</p>\n<p>Используя Monsei, вы соглашаетесь с настоящими условиями. Если вы не согласны с ними, не используйте сервис.</p>\n<h3> 3>5. المحتوى</h3>\n<p>تحتفظ بحقوقك على ما ترسله، وتمنح Monsei الترخيص اللازم لمعالجة رسائلك وعرض سجلك. ويحق لك استخدام الردود التي تتلقاها، مع مراعاة القانون وحقوق الغير.</p>\n<h3>6. الملكية الفكرية</h3>\n<p>العلامة التجارية والشعار والبرمجيات الخاصة بـ Monsei تعود ملكيتها إلى [NOME DO RESPONSÁVEL]. لا يجوز النسخ أو إعادة البيع أو الهندسة العكسية، إلا إذا سمح القانون بذلك.</p>\n<h3>7. تحديد المسؤولية</h3>\n<p>في الحدود التي يسمح بها القانون، لا يتحمل Monsei المسؤولية عن الأضرار غير المباشرة الناتجة عن استخدام ردود الذكاء الاصطناعي. ولا يمس هذا البند حقوق المستهلك التي لا يجيز القانون المحلي استبعادها.</p>\n<h3>8. الإنهاء</h3>\n<p>يحق لك التوقف عن استخدام Monsei وطلب حذف حسابك في أي وقت. ويحق لنا تعليق الوصول في حال مخالفة هذه الشروط.</p>\n<h3>9. القانون الواجب التطبيق</h3>\n<p>تخضع هذه الشروط لقوانين البلد الذي تقيم فيه. وتُحل النزاعات أمام محكمة موطنك، دون المساس بالحقوق التي يكفلها القانون المحلي للمستهلك.</p>\n<h3>10. التعديلات</h3>\n<p>يحق لنا تحديث هذه الشروط. وستُبلَّغ التغييرات الجوهرية قبل أن تسري.</p>\n<h3>11. التواصل</h3>\n<p>[E-MAIL DE CONTATO]</p>"}}};

const RTL = ["ar"];
function safe(fn){ try { return fn(); } catch(e){ return null; } }
const langSel = document.getElementById("lang");
const countrySel = document.getElementById("country");
for (const [k,v] of Object.entries(LANGS)) langSel.add(new Option(v, k));
for (const [k,v] of Object.entries(COUNTRIES)) countrySel.add(new Option(v, k));

function detect(){
  const saved = safe(() => JSON.parse(localStorage.getItem("monsei-legal") || "null"));
  const nav = (navigator.language || "en").toLowerCase();
  let lang = "en";
  if (nav.startsWith("pt")) lang = "pt";
  else if (nav.startsWith("zh")) lang = "zh-CN";
  else { const base = nav.split("-")[0]; if (LANGS[base]) lang = base; }
  let country = nav === "pt-br" ? "br" : (nav.startsWith("pt") ? "geral" : "geral");
  const eu = ["de","fr","it","es","nl","pl","sv","pt-pt"];
  if (nav.startsWith("de") || nav.startsWith("fr") || nav.startsWith("it") || nav.startsWith("es")) country = "eu";
  if (saved && saved.lang && LANGS[saved.lang]) lang = saved.lang;
  if (saved && saved.country && COUNTRIES[saved.country]) country = saved.country;
  return {lang, country};
}
let state = detect();
let doc = new URLSearchParams(location.search).get("doc") === "termos" ? "termos" : "privacidade";
langSel.value = state.lang; countrySel.value = state.country;

function render(){
  const page = safe(() => DATA[state.lang][state.country][doc]) || "<p>Conteúdo indisponível.</p>";
  const article = document.getElementById("doc");
  article.innerHTML = page;
  article.dir = RTL.includes(state.lang) ? "rtl" : "ltr";
  article.lang = state.lang;
  document.getElementById("note").textContent = NOTE[state.lang] || NOTE.pt;
  document.title = "Monsei · " + (doc === "privacidade" ? "Privacidade" : "Termos");
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.doc === doc)));
  safe(() => localStorage.setItem("monsei-legal", JSON.stringify(state)));
}
langSel.addEventListener("change", () => { state.lang = langSel.value; render(); });
countrySel.addEventListener("change", () => { state.country = countrySel.value; render(); });
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => { doc = t.dataset.doc; render(); }));
render();
</script>
