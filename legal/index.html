r pela legislação da União Europeia ou do seu país de residência, nem a responsabilidade que a lei não permite excluir, como danos causados por dolo ou negligência graves ou lesões à pessoa.</p>\n<h3>8. Encerramento</h3>\n<p>Você pode parar de usar o Monsei e pedir a exclusão da conta a qualquer momento. Podemos suspender o acesso em caso de violação destes termos.</p>\n<h3>9. Lei aplicável e resolução de litígios</h3>\n<p>Estes termos são regidos pela lei do seu país de residência habitual, quando você for consumidor. Nesse caso, você pode propor ações no tribunal do seu domicílio. A Comissão Europeia disponibiliza uma plataforma de resolução de litígios online em ec.europa.eu/consumers/odr.</p>\n<h3>10. Alterações</h3>\n<p>Podemos atualizar estes termos. Mudanças relevantes serão comunicadas antes de entrar em vigor.</p>\n<h3>11. Contato</h3>\n<p>[E-MAIL DE CONTATO]</p>"}, "geral": {"privacidade": "<h2>Política de Privacidade do Monsei (demais países)</h2>\n<p>Última atualização: [DATA]</p>\n<p>Esta política explica como o Monsei coleta, usa e protege seus dados pessoais, conforme as leis de privacidade aplicáveis, incluindo as da Califórnia (CCPA/CPRA) e outras leis locais.</p>\n<h3>1. Responsável</h3>\n<p>[NOME DO RESPONSÁVEL], [E-MAIL DE CONTATO].</p>\n<h3>2. Dados coletados</h3>\n<ul>\n<li>E-mail, para criar a conta e enviar o código de login.</li>\n<li>Conteúdo das conversas, incluindo o histórico sincronizado na nuvem.</li>\n<li>Dados técnicos, como data e hora de uso, tipo de navegador e contagem de mensagens.</li>\n</ul>\n<p>Não vendemos dados pessoais e não os compartilhamos para publicidade comportamental.</p>\n<h3>3. Uso dos dados</h3>\n<p>Usamos seus dados para: criar e manter sua conta; responder às perguntas e guardar o histórico; limitar o uso e prevenir abusos; verificar e-mails válidos; cumprir obrigações legais.</p>\n<h3>4. Prestadores</h3>\n<p>Usamos Supabase (autenticação e banco de dados), Cloudflare (Worker e verificação de e-mail), Hugging Face (modelos de IA) e um provedor de e-mail transacional. Eles podem processar dados em outros países.</p>\n<h3>5. Retenção</h3>\n<p>Conversas são guardadas enquanto a conta existir, ou até você excluí-las. Registros de limite de uso são apagados em até duas horas. Dados da conta são guardados até a exclusão solicitada.</p>\n<h3>6. Seus direitos</h3>\n<p>Dependendo de onde você mora, você pode pedir acesso, correção, exclusão e cópia dos seus dados, e se opor ao tratamento. Moradores da Califórnia podem saber quais dados coletamos e pedir a exclusão deles. Para exercer seus direitos, escreva para [E-MAIL DE CONTATO]. Não discriminaremos você por exercê-los.</p>\n<h3>7. Crianças</h3>\n<p>O Monsei não é destinado a menores de 13 anos (ou da idade mínima exigida pela lei local). Se soubermos que coletamos dados de uma criança sem a autorização necessária, apagaremos esses dados.</p>\n<h3>8. Segurança</h3>\n<p>Usamos HTTPS, controle de acesso por usuário e tokens de sessão de validade limitada. Nenhum sistema é totalmente seguro.</p>\n<h3>9. Alterações</h3>\n<p>Publicaremos as mudanças no site. Mudanças relevantes serão comunicadas antes de valer.</p>\n<h3>10. Contato</h3>\n<p>[E-MAIL DE CONTATO]</p>", "termos": "<h2>Termos de Uso do Monsei (demais países)</h2>\n<p>Última atualização: [DATA]</p>\n<p>Ao usar o Monsei, você concorda com estes termos.</p>\n<h3>1. O serviço</h3>\n<p>O Monsei oferece acesso a modelos de inteligência artificial para conversar, tirar dúvidas e pesquisar informações. O serviço pode mudar ou ficar indisponível.</p>\n<h3>2. Conta</h3>\n<p>Você entra com seu e-mail, por código de verificação. Você é responsável pelo que acontece na sua conta.</p>\n<h3>3. Uso aceitável</h3>\n<p>Não use o Monsei para criar ou distribuir malware, atacar sistemas de terceiros, cometer fraudes, violar direitos de outras pessoas, gerar conteúdo ilegal ou contornar os limites de uso.</p>\n<h3>4. Respostas da IA</h3>\n<p>As respostas podem conter erros ou estar desatualizadas e não substituem aconselhamento médico, jurídico, financeiro ou profissional. Confira informações importantes em fontes oficiais.</p>\n<h3>5. Conteúdo</h3>\n<p>Você mantém os direitos sobre o que envia e concede ao Monsei a licença necessária para processar suas mensagens e exibir seu histórico. Você pode usar as respostas recebidas, respeitando a lei e os direitos de terceiros.</p>\n<h3>6. Propriedade intelectual</h3>\n<p>A marca, o logotipo e o software do Monsei pertencem a [NOME DO RESPONSÁVEL]. Não é permitido copiar, revender ou fazer engenharia reversa, salvo quando a lei permitir.</p>\n<h3>7. Limitação de responsabilidade</h3>\n<p>Na medida permitida pela lei, o Monsei não responde por danos indiretos decorrentes do uso das respostas da IA. Esta cláusula não afasta direitos de consumidor que a lei local não permita excluir.</p>\n<h3>8. Encerramento</h3>\n<p>Você pode parar de usar o Monsei e pedir a exclusão da conta a qualquer momento. Podemos suspender o acesso em caso de violação destes termos.</p>\n<h3>9. Lei aplicável</h3>\n<p>Estes termos são regidos pelas leis do país onde você reside. Disputas serão resolvidas no foro do seu domicílio, sem prejuízo de direitos que a lei local garanta ao consumidor.</p>\n<h3>10. Alterações</h3>\n<p>Podemos atualizar estes termos. Mudanças relevantes serão comunicadas antes de valer.</p>\n<h3>11. Contato</h3>\n<p>[E-MAIL DE CONTATO]</p>"}}, "en": {"br": {"privacidade": "<h2>Monsei Privacy Policy (Brazil)</h2>\n<p>Last updated: [DATA]</p>\n<p>This policy explains how Monsei collects, uses, stores and protects your personal data, in compliance with the Lei Geral de Proteção de Dados (LGPD, Brazilian General Data Protection Law, Law No. 13.709/2018).</p>\n<h3>1. Controller</h3>\n<p>The data controller is [NOME DO RESPONSÁVEL]. Contact email: [E-MAIL DE CONTATO].</p>\n<h3>2. What data we collect</h3>\n<ul>\n<li><strong>Account data:</strong> email address, used to sign in to Monsei with a verification code.</li>\n<li><strong>Conversation content:</strong> the questions you send and the answers you receive, including conversations synced to the cloud.</li>\n<li><strong>Technical data:</strong> date and time of use, browser or device type, and message count, used to limit usage per hour.</li>\n</ul>\n<p>We do not request CPF, payment data or sensitive data, and we ask you not to send this type of data in conversations.</p>\n<h3>3. Purposes of use and legal basis</h3>\n<div class='tbl'><table>\n<tr><th>Purpose</th><th>Legal basis (LGPD, art. 7)</th></tr>\n<tr><td>Create and maintain your account and send the login code</td><td>Performance of a contract</td></tr>\n<tr><td>Answer your questions and store your history</td><td>Performance of a contract</td></tr>\n<tr><td>Limit usage per hour and prevent abuse</td><td>Legitimate interest</td></tr>\n<tr><td>Verify that the email is valid and not disposable</td><td>Legitimate interest</td></tr>\n<tr><td>Respond to rights requests and reports</td><td>Compliance with a legal obligation</td></tr>\n</table></div>\n<h3>4. Recipients of data (processors)</h3>\n<p>We use service providers that process data on our behalf:</p>\n<ul>\n<li><strong>Supabase:</strong> email authentication and storage of history.</li>\n<li><strong>Cloudflare:</strong> Worker that bridges the website and the models, and email domain verification.</li>\n<li><strong>Hugging Face:</strong> hosting of the AI models that process your questions.</li>\n<li><strong>Transactional email provider:</strong> delivery of the login code.</li>\n</ul>\n<p>These providers may process data outside Brazil. In such cases, we adopt contractual clauses and appropriate safeguards, in accordance with art. 33 of the LGPD.</p>\n<p>We do not sell personal data.</p>\n<h3>5. How long we keep data</h3>\n<ul>\n<li>Conversations: for as long as the account exists, or until you delete them.</li>\n<li>Hourly usage records: up to two hours, after which they are automatically deleted.</li>\n<li>Account data: until you request deletion or until the applicable legal retention period ends.</li>\n</ul>\n<h3>6. Your rights (art. 18 of the LGPD)</h3>\n<p>You may request confirmation of processing, access, correction, anonymization, portability, deletion of data, information about sharing, and revocation of consent. To do so, write to [E-MAIL DE CONTATO]. We will respond within 15 days.</p>\n<p>You may also file a complaint with the Autoridade Nacional de Proteção de Dados (ANPD, Brazilian National Data Protection Authority).</p>\n<h3>7. Children and adolescents</h3>\n<p>Monsei is not intended for persons under 18 years of age without the authorization of a legal guardian, in accordance with the Estatuto da Criança e do Adolescente (ECA, Brazilian Child and Adolescent Statute). If we become aware that we have collected data from a minor without such authorization, we will delete the data.</p>\n<h3>8. Security</h3>\n<p>We use encryption in transit (HTTPS), per-user access control in the database, and session tokens with limited validity. No system is completely secure, so we recommend a strong email password and the use of two-step verification.</p>\n<h3>9. Changes</h3>\n<p>When this policy changes, we will post notice on the website. Material changes will be communicated in advance.</p>", "termos": "<h2>Monsei Terms of Use (Brazil)</h2>\n<p>Last updated: [DATA]</p>\n<p>By using Monsei, you agree to these terms. If you do not agree, do not use the service.</p>\n<h3>1. The service</h3>\n<p>Monsei provides access to artificial intelligence models for conversation, answering questions and researching information. The service may change, be limited, or become temporarily unavailable.</p>\n<h3>2. Account and access</h3>\n<p>You sign in with your email address by means of a verification code. You are responsible for all activity under your account and must notify [E-MAIL DE CONTATO] if you notice any unauthorized use.</p>\n<h3>3. Acceptable use</h3>\n<p>You agree not to use Monsei to:</p>\n<ul>\n<li>create, distribute or improve malware, attacks against third-party systems, or fraud;</li>\n<li>violate the rights of others, including privacy and intellectual property rights;</li>\n<li>generate illegal content, child sexual exploitation material, or content that incites violence;</li>\n<li>overload the service, circumvent usage limits, or attempt to access the system by unauthorized means.</li>\n</ul>\n<p>We may suspend accounts that violate these rules.</p>\n<h3>4. AI responses</h3>\n<p>Responses are generated automatically and may contain errors, outdated information, or incorrect statements. They do not replace medical, legal, financial or other professional advice. Verify important information against official sources before making decisions.</p>\n<h3>5. Content you send and receive</h3>\n<p>You retain the rights to the content you submit. You grant Monsei the license necessary to process your messages and store them in order to display your history.</p>\n<p>You may use the responses you receive, including for commercial purposes, provided you comply with the law and the rights of third parties.</p>\n<h3>6. Ownership of Monsei</h3>\n<p>The website, brand, logo and models belong to [NOME DO RESPONSÁVEL]. Copying, reselling or reverse engineering the service is not permitted, except where the law allows it.</p>\n<h3>7. Limitation of liability</h3>\n<p>To the extent permitted by law, Monsei is not liable for indirect damages arising from the use of AI responses. This clause does not limit rights guaranteed by the Código de Defesa do Consumidor (CDC, Brazilian Consumer Defense Code), which cannot be waived by contract.</p>\n<h3>8. Termination</h3>\n<p>You may stop using Monsei and request deletion of your account at any time. We may terminate or suspend access in the event of a violation of these terms.</p>\n<h3>9. Governing law and venue</h3>\n<p>These terms are governed by Brazilian law. The venue of the consumer&#x27;s domicile is elected, in accordance with the Código de Defesa do Consumidor.</p>\n<h3>10. Changes</h3>\n<p>We may update these terms. Where a change is material, we will post notice on the website before it takes effect.</p>\n<h3>11. Contact</h3>\n<p>[E-MAIL DE CONTATO]</p>"}, "eu": {"privacidade": "<h2>Monsei Privacy Policy (European Union / EEA)</h2>\n<p>Last updated: [DATA]</p>\n<p>This policy explains how Monsei processes your personal data, in compliance with the General Data Protection Regulation (GDPR, Regulation (EU) 2016/679).</p>\n<h3>1. Controller</h3>\n<p>[NOME DO RESPONSÁVEL], [E-MAIL DE CONTATO]. EU Representative (if applicable): [NOME E CONTATO]. Data Protection Officer: [NOME E CONTATO].</p>\n<h3>2. Data we process</h3>\n<ul>\n<li>Email address, to create your account and send the login code.</li>\n<li>Conversation content, including history synced to the cloud.</li>\n<li>Technical data, such as date and time of use, browser type and message count, to limit usage per hour.</li>\n</ul>\n<p>We do not process special categories of data (art. 9 of the GDPR). We ask you not to include them in your conversations.</p>\n<h3>3. Purposes and legal bases (art. 6)</h3>\n<div class='tbl'><table>\n<tr><th>Purpose</th><th>Legal basis</th></tr>\n<tr><td>Create your account and authenticate login</td><td>Performance of a contract (art. 6(1)(b))</td></tr>\n<tr><td>Answer questions and store history</td><td>Performance of a contract (art. 6(1)(b))</td></tr>\n<tr><td>Limit usage per hour and prevent abuse</td><td>Legitimate interests (art. 6(1)(f))</td></tr>\n<tr><td>Verify that the email exists and is not disposable</td><td>Legitimate interests (art. 6(1)(f))</td></tr>\n<tr><td>Comply with legal obligations</td><td>Legal obligation (art. 6(1)(c))</td></tr>\n</table></div>\n<h3>4. Recipients and international transfers</h3>\n<p>We use processors to provide the service: Supabase (authentication and database), Cloudflare (Worker and domain verification), Hugging Face (AI models), and a transactional email provider. Some of them may be located outside the European Economic Area. In such cases, we rely on the standard contractual clauses approved by the European Commission and supplementary measures where necessary.</p>\n<p>We do not sell personal data.</p>\n<h3>5. Retention periods</h3>\n<ul>\n<li>Conversations: for as long as the account exists, or until you delete them.</li>\n<li>Usage limit records: up to two hours.</li>\n<li>Account data: until deletion is requested, subject to statutory retention periods.</li>\n</ul>\n<h3>6. Your rights (arts. 15 to 22)</h3>\n<p>You have the right of access, rectification, erasure, restriction of processing, portability, objection, and the right not to be subject to a decision based solely on automated processing that produces legal or similarly significant effects. You may withdraw your consent at any time where processing is based on consent.</p>\n<p>To exercise your rights, write to [E-MAIL DE CONTATO]. We will respond within one month, extendable as provided by the regulation.</p>\n<p>You may also lodge a complaint with the supervisory authority of your country of habitual residence.</p>\n<h3>7. Minimum age</h3>\n<p>The service is not intended for persons below the age of digital consent in your country (between 13 and 16 years, as set by national legislation). If we become aware that we have collected data from a child without the necessary authorization, we will erase the data.</p>\n<h3>8. Security</h3>\n<p>We adopt appropriate technical and organizational measures, such as encryption in transit (HTTPS), per-user access control in the database, and session tokens with limited validity.</p>\n<h3>9. Changes</h3>\n<p>When this policy changes, we will publish the new version on the website and, where the change is material, notify you before it takes effect.</p>", "termos": "<h2>Monsei Terms of Use (European Union / EEA)</h2>\n<p>Last updated: [DATA]</p>\n<p>By using Monsei, you agree to these terms.</p>\n<h3>1. The service</h3>\n<p>Monsei provides access to artificial intelligence models for conversation, answering questions and researching information. The service may change or become temporarily unavailable.</p>\n<h3>2. Account</h3>\n<p>You sign in with your email address by means of a verification code. Keep your access secure and notify [E-MAIL DE CONTATO] if you notice any unauthorized use.</p>\n<h3>3. Acceptable use</h3>\n<p>Do not use Monsei to create or distribute malware, attack third-party systems, commit fraud, violate the rights of others, generate illegal content (including child sexual abuse material), or circumvent usage limits. We may suspend accounts that violate these rules.</p>\n<h3>4. AI responses</h3>\n<p>Responses are generated automatically and may contain errors or outdated information. They do not replace medical, legal, financial or other professional advice. Verify important information against official sources.</p>\n<h3>5. Content</h3>\n<p>You retain the rights to the content you submit. You grant Monsei the license necessary to process your messages and display your history. You may use the responses you receive, subject to the law and the rights of third parties.</p>\n<h3>6. Intellectual property</h3>\n<p>The Monsei brand, logo and software belong to [NOME DO RESPONSÁVEL]. Copying, reselling or reverse engineering is not permitted, except where the law allows it.</p>\n<h3>7. Liability</h3>\n<p>To the extent permitted by law, we are not liable for indirect damages arising from the use of AI responses. Nothing in these terms limits the rights you have as a consumer under European Union law or the law of your country of habitual residence, nor any liability that cannot be excluded by law, such as liability for damage caused by intent or gross negligence, or for personal injury.</p>\n<h3>8. Termination</h3>\n<p>You may stop using Monsei and request deletion of your account at any time. We may suspend access in the event of a violation of these terms.</p>\n<h3>9. Governing law and dispute resolution</h3>\n<p>These terms are governed by the law of your country of habitual residence where you are a consumer. In that case, you may bring proceedings before the courts of your domicile. The European Commission provides an online dispute resolution platform at ec.europa.eu/consumers/odr.</p>\n<h3>10. Changes</h3>\n<p>We may update these terms. Material changes will be communicated before they take effect.</p>\n<h3>11. Contact</h3>\n<p>[E-MAIL DE CONTATO]</p>"}, "geral": {"privacidade": "<h2>Monsei Privacy Policy (Other Countries)</h2>\n<p>Last updated: [DATA]</p>\n<p>This policy explains how Monsei collects, uses and protects your personal data, in accordance with applicable privacy laws, including those of California (California Consumer Privacy Act and California Privacy Rights Act, CCPA/CPRA) and other local laws.</p>\n<h3>1. Controller</h3>\n<p>[NOME DO RESPONSÁVEL], [E-MAIL DE CONTATO].</p>\n<h3>2. Data collected</h3>\n<ul>\n<li>Email address, to create your account and send the login code.</li>\n<li>Conversation content, including history synced to the cloud.</li>\n<li>Technical data, such as date and time of use, browser type and message count.</li>\n</ul>\n<p>We do not sell personal data, and we do not share it for cross-context behavioral advertising.</p>\n<h3>3. Use of data</h3>\n<p>We use your data to: create and maintain your account; answer questions and store history; limit usage and prevent abuse; verify valid email addresses; comply with legal obligations.</p>\n<h3>4. Service providers</h3>\n<p>We use Supabase (authentication and database), Cloudflare (Worker and email verification), Hugging Face (AI models), and a transactional email provider. They may process data in other countries.</p>\n<h3>5. Retention</h3>\n<p>Conversations are stored for as long as the account exists, or until you delete them. Usage limit records are deleted within two hours. Account data is stored until deletion is requested.</p>\n<h3>6. Your rights</h3>\n<p>Depending on where you live, you may request access to, correction, deletion and a copy of your data, and object to processing. Residents of California may learn which data we collect and request its deletion. To exercise your rights, write to [E-MAIL DE CONTATO]. We will not discriminate against you for exercising them.</p>\n<h3>7. Children</h3>\n<p>Monsei is not intended for persons under 13 years of age (or the minimum age required by local law). If we become aware that we have collected data from a child without the necessary authorization, we will delete that data.</p>\n<h3>8. Security</h3>\n<p>We use HTTPS, per-user access control and session tokens with limited validity. No system is completely secure.</p>\n<h3>9. Changes</h3>\n<p>We will post changes on the website. Material changes will be communicated before they take effect.</p>\n<h3>10. Contact</h3>\n<p>[E-MAIL DE CONTATO]</p>", "termos": "<h2>Monsei Terms of Use (Other Countries)</h2>\n<p>Last updated: [DATA]</p>\n<p>By using Monsei, you agree to these terms.</p>\n<h3>1. The service</h3>\n<p>Monsei provides access to artificial intelligence models for conversation, answering questions and researching information. The service may change or become unavailable.</p>\n<h3>2. Account</h3>\n<p>You sign in with your email address by means of a verification code. You are responsible for all activity under your account.</p>\n<h3>3. Acceptable use</h3>\n<p>Do not use Monsei to create or distribute malware, attack third-party systems, commit fraud, violate the rights of others, generate illegal content, or circumvent usage limits.</p>\n<h3>4. AI responses</h3>\n<p>Responses may contain errors or be outdated, and do not replace medical, legal, financial or other professional advice. Verify important information against official sources.</p>\n<h3>5. Content</h3>\n<p>You retain the rights to the content you submit, and you grant Monsei the license necessary to process your messages and display your history. You may use the responses you receive, subject to the law and the rights of third parties.</p>\n<h3>6. Intellectual property</h3>\n<p>The Monsei brand, logo and software belong to [NOME DO RESPONSÁVEL]. Copying, reselling or reverse engineering is not permitted, except where the law allows it.</p>\n<h3>7. Limitation of liability</h3>\n<p>To the extent permitted by law, Monsei is not liable for indirect damages arising from the use of AI responses. This clause does not remove consumer rights that local law does not allow to be excluded.</p>\n<h3>8. Termination</h3>\n<p>You may stop using Monsei and request deletion of your account at any time. We may suspend access in the event of a violation of these terms.</p>\n<h3>9. Governing law</h3>\n<p>These terms are governed by the laws of the country where you reside. Disputes will be resolved in the courts of your domicile, without prejudice to any rights that local law grants to consumers.</p>\n<h3>10. Changes</h3>\n<p>We may update these terms. Material changes will be communicated before they take effect.</p>\n<h3>11. Contact</h3>\n<p>[E-MAIL DE CONTATO]</p>"}}, "es": {"br": {"privacidade": "<h2>Política de Privacidad de Monsei (Brasil)</h2>\n<p>Última actualización: [DATA]</p>\n<p>Esta política explica cómo Monsei recopila, usa, conserva y protege sus datos personales, de conformidad con la Lei Geral de Proteção de Dados (LGPD, ley general de protección de datos de Brasil, Ley nº 13.709/2018).</p>\n<h3>1. Quién es el responsable del tratamiento</h3>\n<p>El responsable del tratamiento de los datos es [NOME DO RESPONSÁVEL], correo electrónico de contacto [E-MAIL DE CONTATO].</p>\n<h3>2. Qué datos recopilamos</h3>\n<ul>\n<li><strong>Datos de la cuenta:</strong> dirección de correo electrónico, utilizada para iniciar sesión en Monsei mediante un código de verificación.</li>\n<li><strong>Contenido de las conversaciones:</strong> las preguntas que envía y las respuestas que recibe, incluidas las conversaciones sincronizadas en la nube.</li>\n<li><strong>Datos técnicos:</strong> fecha y hora de uso, tipo de navegador o dispositivo y recuento de mensajes, utilizado para limitar el uso por hora.</li>\n</ul>\n<p>No solicitamos CPF, datos de pago ni datos sensibles, y le pedimos que no envíe este tipo de datos en las conversaciones.</p>\n<h3>3. Para qué usamos los datos y base legal</h3>\n<div class='tbl'><table>\n<tr><th>Finalidad</th><th>Base legal (LGPD, art. 7º)</th></tr>\n<tr><td>Crear y mantener su cuenta y enviar el código de inicio de sesión</td><td>Ejecución de contrato</td></tr>\n<tr><td>Responder a sus preguntas y guardar el historial</td><td>Ejecución de contrato</td></tr>\n<tr><td>Limitar el uso por hora y prevenir abusos</td><td>Interés legítimo</td></tr>\n<tr><td>Verificar que el correo electrónico es válido y no es desechable</td><td>Interés legítimo</td></tr>\n<tr><td>Atender solicitudes de derechos y denuncias</td><td>Cumplimiento de obligación legal</td></tr>\n</table></div>\n<h3>4. Quién recibe los datos (operadores)</h3>\n<p>Utilizamos proveedores que tratan datos en nuestro nombre:</p>\n<ul>\n<li><strong>Supabase:</strong> autenticación por correo electrónico y almacenamiento del historial.</li>\n<li><strong>Cloudflare:</strong> Worker que conecta el sitio con los modelos, y verificación de dominios de correo electrónico.</li>\n<li><strong>Hugging Face:</strong> alojamiento de los modelos de IA que procesan las preguntas.</li>\n<li><strong>Proveedor de correo electrónico transaccional:</strong> envío del código de inicio de sesión.</li>\n</ul>\n<p>Estos proveedores pueden tratar datos fuera de Brasil. En esos casos, adoptamos cláusulas contractuales y garantías adecuadas, conforme al art. 33 de la LGPD.</p>\n<p>No vendemos datos personales.</p>\n<h3>5. Por cuánto tiempo los conservamos</h3>\n<ul>\n<li>Conversaciones: mientras exista la cuenta, o hasta que usted las elimine.</li>\n<li>Registros de uso por hora: hasta dos horas; después se eliminan automáticamente.</li>\n<li>Datos de la cuenta: hasta que solicite su eliminación o hasta el plazo legal de conservación.</li>\n</ul>\n<h3>6. Sus derechos (art. 18 de la LGPD)</h3>\n<p>Puede solicitar la confirmación del tratamiento, acceso, corrección, anonimización, portabilidad, eliminación de los datos, información sobre el uso compartido y revocación del consentimiento. Para ello, escriba a [E-MAIL DE CONTATO]. Responderemos en un plazo de 15 días.</p>\n<p>También puede presentar una reclamación ante la Autoridad Nacional de Protección de Datos (ANPD).</p>\n<h3>7. Niños y adolescentes</h3>\n<p>Monsei no está destinado a menores de 18 años sin la autorización de un representante legal, conforme al Estatuto da Criança e do Adolescente (ECA, estatuto brasileño de la niñez y la adolescencia). Si sabemos que hemos recopilado datos de un menor sin esa autorización, los eliminaremos.</p>\n<h3>8. Seguridad</h3>\n<p>Utilizamos cifrado en tránsito (HTTPS), control de acceso por usuario en la base de datos y tokens de sesión con validez limitada. Ningún sistema es totalmente seguro, por lo que recomendamos una contraseña de correo electrónico robusta y el uso de la verificación en dos pasos.</p>\n<h3>9. Modificaciones</h3>\n<p>Cuando esta política cambie, lo comunicaremos en el sitio web. Los cambios relevantes se notificarán con antelación.</p>", "termos": "<h2>Términos de Uso de Monsei (Brasil)</h2>\n<p>Última actualización: [DATA]</p>\n<p>Al usar Monsei, usted acepta estos términos. Si no está de acuerdo, no utilice el servicio.</p>\n<h3>1. El servicio</h3>\n<p>Monsei ofrece acceso a modelos de inteligencia artificial para conversar, resolver dudas y buscar información. El servicio puede cambiar, limitarse o quedar temporalmente no disponible.</p>\n<h3>2. Cuenta y acceso</h3>\n<p>Usted inicia sesión con su correo electrónico, mediante un código de verificación. Usted es responsable de lo que ocurra en su cuenta y debe avisar a [E-MAIL DE CONTATO] si detecta un uso no autorizado.</p>\n<h3>3. Uso aceptable</h3>\n<p>Usted acepta no utilizar Monsei para:</p>\n<ul>\n<li>crear, distribuir o mejorar malware, ataques contra sistemas de terceros o fraudes;</li>\n<li>vulnerar los derechos de otras personas, incluidos los de privacidad y propiedad intelectual;</li>\n<li>generar contenido ilegal, de explotación sexual infantil o que incite a la violencia;</li>\n<li>sobrecargar el servicio, eludir los límites de uso o intentar acceder al sistema por medios no autorizados.</li>\n</ul>\n<p>Podemos suspender las cuentas que incumplan estas normas.</p>\n<h3>4. Respuestas de la IA</h3>\n<p>Las respuestas se generan automáticamente y pueden contener errores, información desactualizada o afirmaciones incorrectas. No sustituyen la orientación médica, jurídica, financiera o profesional. Verifique la información importante en fuentes oficiales antes de tomar decisiones.</p>\n<h3>5. Contenido que usted envía y recibe</h3>\n<p>Usted conserva los derechos sobre el contenido que envía. Otorga a Monsei la licencia necesaria para procesar sus mensajes y almacenarlos para mostrar su historial.</p>\n<p>Puede utilizar las respuestas recibidas, incluso con fines comerciales, respetando la ley y los derechos de terceros.</p>\n<h3>6. Propiedad de Monsei</h3>\n<p>El sitio web, la marca, el logotipo y los modelos pertenecen a [NOME DO RESPONSÁVEL]. No está permitido copiar, revender ni realizar ingeniería inversa del servicio, salvo cuando la ley lo permita.</p>\n<h3>7. Limitación de responsabilidad</h3>\n<p>En la medida permitida por la ley, Monsei no responde por los perjuicios indirectos causados por el uso de las respuestas de la IA. Esta cláusula no limita los derechos garantizados por el Código de Defesa do Consumidor (Código de Defensa del Consumidor de Brasil), que no pueden excluirse por contrato.</p>\n<h3>8. Terminación</h3>\n<p>Puede dejar de usar Monsei y solicitar la eliminación de su cuenta en cualquier momento. Podemos poner fin o suspender el acceso en caso de incumplimiento de estos términos.</p>\n<h3>9. Ley aplicable y fuero</h3>\n<p>Estos términos se rigen por la ley brasileña. Se establece el fuero del domicilio del consumidor, de conformidad con el Código de Defesa do Consumidor.</p>\n<h3>10. Modificaciones</h3>\n<p>Podemos actualizar estos términos. Cuando el cambio sea relevante, lo comunicaremos en el sitio web antes de que entre en vigor.</p>\n<h3>11. Contacto</h3>\n<p>[E-MAIL DE CONTATO]</p>"}, "eu": {"privacidade": "<h2>Política de Privacidad de Monsei (Unión Europea / EEE)</h2>\n<p>Última actualización: [DATA]</p>\n<p>Esta política explica cómo Monsei trata sus datos personales, de conformidad con el Regulamento Geral sobre a Proteção de Dados (RGPD / GDPR, Reglamento General de Protección de Datos de la UE, Reglamento (UE) 2016/679).</p>\n<h3>1. Responsable del tratamiento</h3>\n<p>[NOME DO RESPONSÁVEL], [E-MAIL DE CONTATO]. Representante en la UE (si procede): [NOME E CONTATO]. Delegado de protección de datos: [NOME E CONTATO].</p>\n<h3>2. Datos que tratamos</h3>\n<ul>\n<li>Dirección de correo electrónico, para crear la cuenta y enviar el código de inicio de sesión.</li>\n<li>Contenido de las conversaciones, incluido el historial sincronizado en la nube.</li>\n<li>Datos técnicos, como fecha y hora de uso, tipo de navegador y recuento de mensajes, para limitar el uso por hora.</li>\n</ul>\n<p>No tratamos categorías especiales de datos (art. 9 del GDPR). Le pedimos que no las envíe en las conversaciones.</p>\n<h3>3. Finalidades y bases jurídicas (art. 6)</h3>\n<div class='tbl'><table>\n<tr><th>Finalidad</th><th>Base jurídica</th></tr>\n<tr><td>Crear la cuenta y autenticar el inicio de sesión</td><td>Ejecución de contrato (art. 6, 1, b)</td></tr>\n<tr><td>Responder a las preguntas y guardar el historial</td><td>Ejecución de contrato (art. 6, 1, b)</td></tr>\n<tr><td>Limitar el uso por hora y prevenir abusos</td><td>Interés legítimo (art. 6, 1, f)</td></tr>\n<tr><td>Verificar que el correo electrónico existe y no es desechable</td><td>Interés legítimo (art. 6, 1, f)</td></tr>\n<tr><td>Cumplir obligaciones legales</td><td>Obligación legal (art. 6, 1, c)</td></tr>\n</table></div>\n<h3>4. Destinatarios y transferencias internacionales</h3>\n<p>Utilizamos encargados del tratamiento para prestar el servicio: Supabase (autenticación y base de datos), Cloudflare (Worker y verificación de dominios), Hugging Face (modelos de IA) y un proveedor de correo electrónico transaccional. Algunos pueden estar fuera del Espacio Económico Europeo. En esos casos, utilizamos las cláusulas contractuales tipo aprobadas por la Comisión Europea y medidas complementarias cuando sea necesario.</p>\n<p>No vendemos datos personales.</p>\n<h3>5. Plazos de conservación</h3>\n<ul>\n<li>Conversaciones: mientras exista la cuenta, o hasta que usted las elimine.</li>\n<li>Registros de límite de uso: hasta dos horas.</li>\n<li>Datos de la cuenta: hasta la eliminación solicitada, respetando los plazos legales.</li>\n</ul>\n<h3>6. Sus derechos (arts. 15 a 22)</h3>\n<p>Usted tiene derecho de acceso, rectificación, supresión, limitación del tratamiento, portabilidad, oposición y a no ser objeto de decisiones basadas únicamente en el tratamiento automatizado que produzcan efectos jurídicos significativos. Puede retirar su consentimiento en cualquier momento, cuando el tratamiento se base en él.</p>\n<p>Para ejercer sus derechos, escriba a [E-MAIL DE CONTATO]. Responderemos en el plazo de un mes, prorrogable en los términos del reglamento.</p>\n<p>También puede presentar una reclamación ante la autoridad de control de su país de residencia habitual.</p>\n<h3>7. Edad mínima</h3>\n<p>El servicio no está destinado a menores de la edad de consentimiento digital de su país (entre 13 y 16 años, según la legislación nacional). Si sabemos que hemos recopilado datos de un niño sin la autorización necesaria, los eliminaremos.</p>\n<h3>8. Seguridad</h3>\n<p>Adoptamos medidas técnicas y organizativas adecuadas, como cifrado en tránsito (HTTPS), control de acceso por usuario en la base de datos y tokens de sesión de validez limitada.</p>\n<h3>9. Modificaciones</h3>\n<p>Cuando esta política cambie, publicaremos la nueva versión en el sitio web y, si el cambio es relevante, le avisaremos antes de que entre en vigor.</p>", "termos": "<h2>Términos de Uso de Monsei (Unión Europea / EEE)</h2>\n<p>Última actualización: [DATA]</p>\n<p>Al usar Monsei, usted acepta estos términos.</p>\n<h3>1. El servicio</h3>\n<p>Monsei ofrece acceso a modelos de inteligencia artificial para conversar, resolver dudas y buscar información. El servicio puede cambiar o quedar temporalmente no disponible.</p>\n<h3>2. Cuenta</h3>\n<p>Usted inicia sesión con su correo electrónico, mediante un código de verificación. Mantenga su acceso seguro y avise a [E-MAIL DE CONTATO] si detecta un uso no autorizado.</p>\n<h3>3. Uso aceptable</h3>\n<p>No utilice Monsei para crear o distribuir malware, atacar sistemas de terceros, cometer fraudes, vulnerar los derechos de otras personas, generar contenido ilegal (incluido el abuso sexual de menores) o eludir los límites de uso. Podemos suspender las cuentas que incumplan estas normas.</p>\n<h3>4. Respuestas de la IA</h3>\n<p>Las respuestas se generan automáticamente y pueden contener errores o información desactualizada. No sustituyen el asesoramiento médico, jurídico, financiero o profesional. Verifique la información importante en fuentes oficiales.</p>\n<h3>5. Contenido</h3>\n<p>Usted conserva los derechos sobre el contenido que envía. Otorga a Monsei la licencia necesaria para procesar sus mensajes y mostrar su historial. Puede utilizar las respuestas recibidas, respetando la ley y los derechos de terceros.</p>\n<h3>6. Propiedad intelectual</h3>\n<p>La marca, el logotipo y el software de Monsei pertenecen a [NOME DO RESPONSÁVEL]. No está permitido copiar, revender ni realizar ingeniería inversa, salvo cuando la ley lo permita.</p>\n<h3>7. Responsabilidad</h3>\n<p>En la medida permitida por la ley, no nos responsabilizamos de los daños indirectos derivados del uso de las respuestas de la IA. Nada en estos términos limita los derechos que usted tiene como consumidor en virtud de la legislación de la Unión Europea o de su país de residencia, ni la responsabilidad que la ley no permite excluir, como los daños causados por dolo o negligencia grave o las lesiones a la persona.</p>\n<h3>8. Terminación</h3>\n<p>Puede dejar de usar Monsei y solicitar la eliminación de su cuenta en cualquier momento. Podemos suspender el acceso en caso de incumplimiento de estos términos.</p>\n<h3>9. Ley aplicable y resolución de litigios</h3>\n<p>Estos términos se rigen por la ley del país de su residencia habitual, cuando usted sea consumidor. En ese caso, puede interponer acciones ante los tribunales de su domicilio. La Comisión Europea pone a disposición una plataforma de resolución de litigios en línea en ec.europa.eu/consumers/odr.</p>\n<h3>10. Modificaciones</h3>\n<p>Podemos actualizar estos términos. Los cambios relevantes se comunicarán antes de que entren en vigor.</p>\n<h3>11. Contacto</h3>\n<p>[E-MAIL DE CONTATO]</p>"}, "geral": {"privacidade": "<h2>Política de Privacidad de Monsei (demás países)</h2>\n<p>Última actualización: [DATA]</p>\n<p>Esta política explica cómo Monsei recopila, usa y protege sus datos personales, conforme a las leyes de privacidad aplicables, incluidas las de California (CCPA/CPRA, Ley de Privacidad del Consumidor de California y su enmienda, la Ley de Derechos de Privacidad de California) y otras leyes locales.</p>\n<h3>1. Responsable</h3>\n<p>[NOME DO RESPONSÁVEL], [E-MAIL DE CONTATO].</p>\n<h3>2. Datos recopilados</h3>\n<ul>\n<li>Correo electrónico, para crear la cuenta y enviar el código de inicio de sesión.</li>\n<li>Contenido de las conversaciones, incluido el historial sincronizado en la nube.</li>\n<li>Datos técnicos, como fecha y hora de uso, tipo de navegador y recuento de mensajes.</li>\n</ul>\n<p>No vendemos datos personales ni los compartimos para publicidad comportamental.</p>\n<h3>3. Uso de los datos</h3>\n<p>Usamos sus datos para: crear y mantener su cuenta; responder a las preguntas y guardar el historial; limitar el uso y prevenir abusos; verificar correos electrónicos válidos; cumplir obligaciones legales.</p>\n<h3>4. Proveedores</h3>\n<p>Utilizamos Supabase (autenticación y base de datos), Cloudflare (Worker y verificación de correo electrónico), Hugging Face (modelos de IA) y un proveedor de correo electrónico transaccional. Pueden tratar datos en otros países.</p>\n<h3>5. Conservación</h3>\n<p>Las conversaciones se guardan mientras exista la cuenta, o hasta que usted las elimine. Los registros de límite de uso se eliminan en un plazo de hasta dos horas. Los datos de la cuenta se conservan hasta la eliminación solicitada.</p>\n<h3>6. Sus derechos</h3>\n<p>Según el lugar donde resida, puede solicitar acceso, corrección, eliminación y copia de sus datos, y oponerse al tratamiento. Los residentes de California pueden conocer qué datos recopilamos y solicitar su eliminación. Para ejercer sus derechos, escriba a [E-MAIL DE CONTATO]. No le discriminaremos por ejercerlos.</p>\n<h3>7. Niños</h3>\n<p>Monsei no está destinado a menores de 13 años (o de la edad mínima exigida por la ley local). Si sabemos que hemos recopilado datos de un niño sin la autorización necesaria, eliminaremos esos datos.</p>\n<h3>8. Seguridad</h3>\n<p>Utilizamos HTTPS, control de acceso por usuario y tokens de sesión de validez limitada. Ningún sistema es totalmente seguro.</p>\n<h3>9. Modificaciones</h3>\n<p>Publicaremos los cambios en el sitio web. Los cambios relevantes se comunicarán antes de entrar en vigor.</p>\n<h3>10. Contacto</h3>\n<p>[E-MAIL DE CONTATO]</p>", "termos": "<h2>Términos de Uso de Monsei (demás países)</h2>\n<p>Última actualización: [DATA]</p>\n<p>Al usar Monsei, usted acepta estos términos.</p>\n<h3>1. El servicio</h3>\n<p>Monsei ofrece acceso a modelos de inteligencia artificial para conversar, resolver dudas y buscar información. El servicio puede cambiar o quedar no disponible.</p>\n<h3>2. Cuenta</h3>\n<p>Usted inicia sesión con su correo electrónico, mediante un código de verificación. Usted es responsable de lo que ocurra en su cuenta.</p>\n<h3>3. Uso aceptable</h3>\n<p>No utilice Monsei para crear o distribuir malware, atacar sistemas de terceros, cometer fraudes, vulnerar los derechos de otras personas, generar contenido ilegal ni eludir los límites de uso.</p>\n<h3>4. Respuestas de la IA</h3>\n<p>Las respuestas pueden contener errores o estar desactualizadas, y no sustituyen el asesoramiento médico, jurídico, financiero o profesional. Verifique la información importante en fuentes oficiales.</p>\n<h3>5. Contenido</h3>\n<p>Usted conserva los derechos sobre lo que envía y otorga a Monsei la licencia necesaria para procesar sus mensajes y mostrar su historial. Puede utilizar las respuestas recibidas, respetando la ley y los derechos de terceros.</p>\n<h3>6. Propiedad intelectual</h3>\n<p>La marca, el logotipo y el software de Monsei pertenecen a [NOME DO RESPONSÁVEL]. No está permitido copiar, revender ni realizar ingeniería inversa, salvo cuando la ley lo permita.</p>\n<h3>7. Limitación de responsabilidad</h3>\n<p>En la medida permitida por la ley, Monsei no responde por los daños indirectos derivados del uso de las respuestas de la IA. Esta cláusula no excluye los derechos de consumidor que la legislación local no permita excluir.</p>\n<h3>8. Terminación</h3>\n<p>Puede dejar de usar Monsei y solicitar la eliminación de su cuenta en cualquier momento. Podemos suspender el acceso en caso de incumplimiento de estos términos.</p>\n<h3>9. Ley aplicable</h3>\n<p>Estos términos se rigen por las leyes del país donde usted reside. Las controversias se resolverán ante los tribunales de su domicilio, sin perjuicio de los derechos que la legislación local garantice al consumidor.</p>\n<h3>10. Modificaciones</h3>\n<p>Podemos actualizar estos términos. Los cambios relevantes se comunicarán antes de entrar en vigor.</p>\n<h3>11. Contacto</h3>\n<p>[E-MAIL DE CONTATO]</p>"}}, "fr": {"br": {"privacidade": "<h2>Politique de confidentialité de Monsei (Brésil)</h2>\n<p>Dernière mise à jour : [DATA]</p>\n<p>La présente politique explique comment Monsei collecte, utilise, conserve et protège vos données personnelles, conformément à la Lei Geral de Proteção de Dados (LGPD, loi générale brésilienne sur la protection des données, loi n° 13.709/2018).</p>\n<h3>1. Qui est le responsable du traitement</h3>\n<p>Le responsable du traitement des données est [NOME DO RESPONSÁVEL]. E-mail de contact : [E-MAIL DE CONTATO].</p>\n<h3>2. Quelles données nous collectons</h3>\n<ul>\n<li><strong>Données de compte :</strong> adresse e-mail, utilisée pour vous connecter à Monsei au moyen d&#x27;un code de vérification.</li>\n<li><strong>Contenu des conversations :</strong> les questions que vous envoyez et les réponses que vous recevez, y compris les conversations synchronisées dans le cloud.</li>\n<li><strong>Données techniques :</strong> date et heure d&#x27;utilisation, type de navigateur ou d&#x27;appareil et nombre de messages, utilisé pour limiter l&#x27;usage par heure.</li>\n</ul>\n<p>Nous ne demandons pas de CPF, de données de paiement ni de données sensibles, et nous vous demandons de ne pas transmettre ce type de données dans les conversations.</p>\n<h3>3. Finalités du traitement et base juridique</h3>\n<div class='tbl'><table>\n<tr><th>Finalité</th><th>Base juridique (LGPD, art. 7º)</th></tr>\n<tr><td>Créer et gérer votre compte et envoyer le code de connexion</td><td>Exécution d&#x27;un contrat</td></tr>\n<tr><td>Répondre à vos questions et conserver l&#x27;historique</td><td>Exécution d&#x27;un contrat</td></tr>\n<tr><td>Limiter l&#x27;usage par heure et prévenir les abus</td><td>Intérêt légitime</td></tr>\n<tr><td>Vérifier que l&#x27;e-mail est valide et n&#x27;est pas jetable</td><td>Intérêt légitime</td></tr>\n<tr><td>Répondre aux demandes relatives aux droits et aux signalements</td><td>Respect d&#x27;une obligation légale</td></tr>\n</table></div>\n<h3>4. Destinataires des données (sous-traitants)</h3>\n<p>Nous faisons appel à des prestataires qui traitent les données en notre nom :</p>\n<ul>\n<li><strong>Supabase :</strong> authentification par e-mail et stockage de l&#x27;historique.</li>\n<li><strong>Cloudflare :</strong> Worker qui assure la liaison entre le site et les modèles, et vérification du domaine de messagerie.</li>\n<li><strong>Hugging Face :</strong> hébergement des modèles d&#x27;IA qui traitent les questions.</li>\n<li><strong>Fournisseur de messagerie transactionnelle :</strong> envoi du code de connexion.</li>\n</ul>\n<p>Ces prestataires peuvent traiter des données en dehors du Brésil. Dans ce cas, nous adoptons des clauses contractuelles et des garanties appropriées, conformément à l&#x27;art. 33 de la LGPD.</p>\n<p>Nous ne vendons pas de données personnelles.</p>\n<h3>5. Durée de conservation</h3>\n<ul>\n<li>Conversations : tant que le compte existe, ou jusqu&#x27;à ce que vous les supprimiez.</li>\n<li>Registres d&#x27;usage horaire : jusqu&#x27;à deux heures, puis effacés automatiquement.</li>\n<li>Données de compte : jusqu&#x27;à ce que vous demandiez leur suppression, ou jusqu&#x27;à l&#x27;échéance du délai légal de conservation.</li>\n</ul>\n<h3>6. Vos droits (art. 18 de la LGPD)</h3>\n<p>Vous pouvez demander la confirmation du traitement, l&#x27;accès, la correction, l&#x27;anonymisation, la portabilité, l&#x27;effacement des données, des informations sur le partage et la révocation du consentement. Pour cela, écrivez à [E-MAIL DE CONTATO]. Nous répondrons dans un délai de 15 jours.</p>\n<p>Vous pouvez également introduire une réclamation auprès de l&#x27;Autoridade Nacional de Proteção de Dados (ANPD).</p>\n<h3>7. Enfants et adolescents</h3>\n<p>Monsei n&#x27;est pas destiné aux personnes de moins de 18 ans sans l&#x27;autorisation d&#x27;un représentant légal, conformément à l&#x27;Estatuto da Criança e do Adolescente (ECA, statut brésilien de l&#x27;enfant et de l&#x27;adolescent). Si nous apprenons que nous avons collecté des données d&#x27;un mineur sans cette autorisation, nous supprimerons ces données.</p>\n<h3>8. Sécurité</h3>\n<p>Nous utilisons le chiffrement en transit (HTTPS), un contrôle d&#x27;accès par utilisateur dans la base de données et des jetons de session à durée de validité limitée. Aucun système n&#x27;est totalement sûr ; nous vous recommandons donc un mot de passe de messagerie robuste et l&#x27;activation de la vérification en deux étapes.</p>\n<h3>9. Modifications</h3>\n<p>Lorsque la présente politique sera modifiée, nous en informerons sur le site. Les modifications importantes seront communiquées à l&#x27;avance.</p>", "termos": "<h2>Conditions d&#x27;utilisation de Monsei (Brésil)</h2>\n<p>Dernière mise à jour : [DATA]</p>\n<p>En utilisant Monsei, vous acceptez les présentes conditions. Si vous ne les acceptez pas, n&#x27;utilisez pas le service.</p>\n<h3>1. Le service</h3>\n<p>Monsei donne accès à des modèles d&#x27;intelligence artificielle pour converser, répondre à vos questions et rechercher des informations. Le service peut être modifié, limité ou temporairement indisponible.</p>\n<h3>2. Compte et accès</h3>\n<p>Vous vous connectez avec votre adresse e-mail, au moyen d&#x27;un code de vérification. Vous êtes responsable de ce qui se passe sur votre compte et devez signaler à [E-MAIL DE CONTATO] toute utilisation non autorisée que vous constateriez.</p>\n<h3>3. Utilisation acceptable</h3>\n<p>Vous vous engagez à ne pas utiliser Monsei pour :</p>\n<ul>\n<li>créer, distribuer ou améliorer des logiciels malveillants, des attaques contre les systèmes de tiers ou des fraudes ;</li>\n<li>porter atteinte aux droits d&#x27;autrui, y compris en matière de vie privée et de propriété intellectuelle ;</li>\n<li>générer des contenus illicites, d&#x27;exploitation sexuelle d&#x27;enfants ou incitant à la violence ;</li>\n<li>surcharger le service, contourner les limites d&#x27;utilisation ou tenter d&#x27;accéder au système par des moyens non autorisés.</li>\n</ul>\n<p>Nous pouvons suspendre les comptes qui enfreignent ces règles.</p>\n<h3>4. Réponses de l&#x27;IA</h3>\n<p>Les réponses sont générées automatiquement et peuvent contenir des erreurs, des informations obsolètes ou des affirmations inexactes. Elles ne remplacent pas un avis médical, juridique, financier ou professionnel. Vérifiez les informations importantes auprès de sources officielles avant de prendre toute décision.</p>\n<h3>5. Contenu que vous envoyez et recevez</h3>\n<p>Vous conservez les droits sur ce que vous envoyez. Vous concédez à Monsei la licence nécessaire pour traiter vos messages et les conserver afin d&#x27;afficher votre historique.</p>\n<p>Vous pouvez utiliser les réponses reçues, y compris à des fins commerciales, dans le respect de la loi et des droits de tiers.</p>\n<h3>6. Propriété de Monsei</h3>\n<p>Le site, la marque, le logo et les modèles appartiennent à [NOME DO RESPONSÁVEL]. Il est interdit de copier, revendre ou procéder à l&#x27;ingénierie inverse du service, sauf lorsque la loi le permet.</p>\n<h3>7. Limitation de responsabilité</h3>\n<p>Dans la mesure permise par la loi, Monsei n&#x27;est pas responsable des préjudices indirects causés par l&#x27;utilisation des réponses de l&#x27;IA. La présente clause ne limite pas les droits garantis par le Código de Defesa do Consumidor (CDC, code brésilien de protection du consommateur), qui ne peuvent pas être écartés par contrat.</p>\n<h3>8. Résiliation</h3>\n<p>Vous pouvez cesser d&#x27;utiliser Monsei et demander la suppression de votre compte à tout moment. Nous pouvons mettre fin ou suspendre l&#x27;accès en cas de violation des présentes conditions.</p>\n<h3>9. Droit applicable et for compétent</h3>\n<p>Les présentes conditions sont régies par le droit brésilien. Le for du domicile du consommateur est retenu, conformément au Código de Defesa do Consumidor.</p>\n<h3>10. Modifications</h3>\n<p>Nous pouvons mettre à jour les présentes conditions. Lorsque la modification sera importante, nous en informerons le site avant son entrée en vigueur.</p>\n<h3>11. Contact</h3>\n<p>[E-MAIL DE CONTATO]</p>"}, "eu": {"privacidade": "<h2>Politique de confidentialité de Monsei (Union européenne / EEE)</h2>\n<p>Dernière mise à jour : [DATA]</p>\n<p>La présente politique explique comment Monsei traite vos données personnelles, conformément au Règlement général sur la protection des données (RGPD / GDPR, règlement (UE) 2016/679).</p>\n<h3>1. Responsable du traitement</h3>\n<p>[NOME DO RESPONSÁVEL], [E-MAIL DE CONTATO]. Représentant dans l&#x27;UE (le cas échéant) : [NOME E CONTATO]. Délégué à la protection des données : [NOME E CONTATO].</p>\n<h3>2. Données que nous traitons</h3>\n<ul>\n<li>Adresse e-mail, pour créer le compte et envoyer le code de connexion.</li>\n<li>Contenu des conversations, y compris l&#x27;historique synchronisé dans le cloud.</li>\n<li>Données techniques, telles que la date et l&#x27;heure d&#x27;utilisation, le type de navigateur et le nombre de messages, afin de limiter l&#x27;usage par heure.</li>\n</ul>\n<p>Nous ne traitons pas de catégories particulières de données (art. 9 du RGPD). Nous vous demandons de ne pas les transmettre dans les conversations.</p>\n<h3>3. Finalités et bases juridiques (art. 6)</h3>\n<div class='tbl'><table>\n<tr><th>Finalité</th><th>Base juridique</th></tr>\n<tr><td>Créer le compte et authentifier la connexion</td><td>Exécution d&#x27;un contrat (art. 6, 1, b)</td></tr>\n<tr><td>Répondre aux questions et conserver l&#x27;historique</td><td>Exécution d&#x27;un contrat (art. 6, 1, b)</td></tr>\n<tr><td>Limiter l&#x27;usage par heure et prévenir les abus</td><td>Intérêt légitime (art. 6, 1, f)</td></tr>\n<tr><td>Vérifier que l&#x27;e-mail existe et n&#x27;est pas jetable</td><td>Intérêt légitime (art. 6, 1, f)</td></tr>\n<tr><td>Respecter les obligations légales</td><td>Obligation légale (art. 6, 1, c)</td></tr>\n</table></div>\n<h3>4. Destinataires et transferts internationaux</h3>\n<p>Nous faisons appel à des sous-traitants pour fournir le service : Supabase (authentification et base de données), Cloudflare (Worker et vérification de domaine), Hugging Face (modèles d&#x27;IA) et un fournisseur de messagerie transactionnelle. Certains peuvent être situés en dehors de l&#x27;Espace économique européen. Dans ce cas, nous recourons aux clauses contractuelles types approuvées par la Commission européenne et, si nécessaire, à des mesures complémentaires.</p>\n<p>Nous ne vendons pas de données personnelles.</p>\n<h3>5. Durées de conservation</h3>\n<ul>\n<li>Conversations : tant que le compte existe, ou jusqu&#x27;à ce que vous les supprimiez.</li>\n<li>Registres de limite d&#x27;usage : deux heures au maximum.</li>\n<li>Données de compte : jusqu&#x27;à la suppression demandée, dans le respect des délais légaux.</li>\n</ul>\n<h3>6. Vos droits (art. 15 à 22)</h3>\n<p>Vous disposez d&#x27;un droit d&#x27;accès, de rectification, d&#x27;effacement, de limitation du traitement, de portabilité et d&#x27;opposition, ainsi que du droit de ne pas faire l&#x27;objet d&#x27;une décision fondée exclusivement sur un traitement automatisé produisant un effet juridique significatif. Vous pouvez retirer votre consentement à tout moment lorsque le traitement repose sur celui-ci.</p>\n<p>Pour exercer vos droits, écrivez à [E-MAIL DE CONTATO]. Nous répondrons dans un délai d&#x27;un mois, prorogeable dans les conditions prévues par le règlement.</p>\n<p>Vous pouvez également introduire une réclamation auprès de l&#x27;autorité de contrôle de votre pays de résidence habituelle.</p>\n<h3>7. Âge minimum</h3>\n<p>Le service n&#x27;est pas destiné aux mineurs ayant moins que l&#x27;âge de consentement numérique de votre pays (entre 13 et 16 ans, selon la législation nationale). Si nous apprenons que nous avons collecté des données d&#x27;un enfant sans l&#x27;autorisation nécessaire, nous supprimerons ces données.</p>\n<h3>8. Sécurité</h3>\n<p>Nous mettons en œuvre des mesures techniques et organisationnelles appropriées, telles que le chiffrement en transit (HTTPS), un contrôle d&#x27;accès par utilisateur dans la base de données et des jetons de session à durée de validité limitée.</p>\n<h3>9. Modifications</h3>\n<p>Lorsque la présente politique sera modifiée, nous publierons la nouvelle version sur le site et, si la modification est importante, nous vous en informerons avant son entrée en vigueur.</p>", "termos": "<h2>Conditions d&#x27;utilisation de Monsei (Union européenne / EEE)</h2>\n<p>Dernière mise à jour : [DATA]</p>\n<p>En utilisant Monsei, vous acceptez les présentes conditions.</p>\n<h3>1. Le service</h3>\n<p>Monsei donne accès à des modèles d&#x27;intelligence artificielle pour converser, répondre à vos questions et rechercher des informations. Le service peut être modifié ou temporairement indisponible.</p>\n<h3>2. Compte</h3>\n<p>Vous vous connectez avec votre adresse e-mail, au moyen d&#x27;un code de vérification. Gardez votre accès en sécurité et signalez à [E-MAIL DE CONTATO] toute utilisation non autorisée que vous constateriez.</p>\n<h3>3. Utilisation acceptable</h3>\n<p>N&#x27;utilisez pas Monsei pour créer ou distribuer des logiciels malveillants, attaquer des systèmes de tiers, commettre des fraudes, porter atteinte aux droits d&#x27;autrui, générer des contenus illicites (y compris l&#x27;abus sexuel d&#x27;enfants) ou contourner les limites d&#x27;utilisation. Nous pouvons suspendre les comptes qui enfreignent ces règles.</p>\n<h3>4. Réponses de l&#x27;IA</h3>\n<p>Les réponses sont générées automatiquement et peuvent contenir des erreurs ou des informations obsolètes. Elles ne remplacent pas un avis médical, juridique, financier ou professionnel. Vérifiez les informations importantes auprès de sources officielles.</p>\n<h3>5. Contenu</h3>\n<p>Vous conservez les droits sur ce que vous envoyez. Vous concédez à Monsei la licence nécessaire pour traiter vos messages et afficher votre historique. Vous pouvez utiliser les réponses reçues, dans le respect de la loi et des droits de tiers.</p>\n<h3>6. Propriété intellectuelle</h3>\n<p>La marque, le logo et le logiciel de Monsei appartiennent à [NOME DO RESPONSÁVEL]. Il est interdit de copier, revendre ou procéder à l&#x27;ingénierie inverse, sauf lorsque la loi le permet.</p>\n<h3>7. Responsabilité</h3>\n<p>Dans la mesure permise par la loi, nous ne sommes pas responsables des dommages indirects résultant de l&#x27;utilisation des réponses de l&#x27;IA. Rien dans les présentes conditions ne limite les droits que vous avez en tant que consommateur en vertu du droit de l&#x27;Union européenne ou de votre pays de résidence, ni la responsabilité que la loi ne permet pas d&#x27;exclure, notamment en cas de dommages causés par dol ou par négligence grave, ou d&#x27;atteintes à la personne.</p>\n<h3>8. Résiliation</h3>\n<p>Vous pouvez cesser d&#x27;utiliser Monsei et demander la suppression de votre compte à tout moment. Nous pouvons suspendre l&#x27;accès en cas de violation des présentes conditions.</p>\n<h3>9. Droit applicable et règlement des litiges</h3>\n<p>Les présentes conditions sont régies par le droit du pays de votre résidence habituelle, lorsque vous êtes consommateur. Dans ce cas, vous pouvez intenter une action devant les tribunaux de votre domicile. La Commission européenne met à disposition une plateforme de règlement en ligne des litiges à l&#x27;adresse ec.europa.eu/consumers/odr.</p>\n<h3>10. Modifications</h3>\n<p>Nous pouvons mettre à jour les présentes conditions. Les modifications importantes seront communiquées avant leur entrée en vigueur.</p>\n<h3>11. Contact</h3>\n<p>[E-MAIL DE CONTATO]</p>"}, "geral": {"privacidade": "<h2>Politique de confidentialité de Monsei (autres pays)</h2>\n<p>Dernière mise à jour : [DATA]</p>\n<p>La présente politique explique comment Monsei collecte, utilise et protège vos données personnelles, conformément aux lois applicables en matière de confidentialité, y compris la California Consumer Privacy Act / California Privacy Rights Act (CCPA/CPRA, lois de Californie sur la protection de la vie privée des consommateurs) et les autres lois locales.</p>\n<h3>1. Responsable</h3>\n<p>[NOME DO RESPONSÁVEL], [E-MAIL DE CONTATO].</p>\n<h3>2. Données collectées</h3>\n<ul>\n<li>Adresse e-mail, pour créer le compte et envoyer le code de connexion.</li>\n<li>Contenu des conversations, y compris l&#x27;historique synchronisé dans le cloud.</li>\n<li>Données techniques, telles que la date et l&#x27;heure d&#x27;utilisation, le type de navigateur et le nombre de messages.</li>\n</ul>\n<p>Nous ne vendons pas de données personnelles et ne les partageons pas à des fins de publicité comportementale.</p>\n<h3>3. Utilisation des données</h3>\n<p>Nous utilisons vos données pour : créer et gérer votre compte ; répondre à vos questions et conserver l&#x27;historique ; limiter l&#x27;usage et prévenir les abus ; vérifier la validité des e-mails ; respecter nos obligations légales.</p>\n<h3>4. Prestataires</h3>\n<p>Nous utilisons Supabase (authentification et base de données), Cloudflare (Worker et vérification des e-mails), Hugging Face (modèles d&#x27;IA) et un fournisseur de messagerie transactionnelle. Ils peuvent traiter des données dans d&#x27;autres pays.</p>\n<h3>5. Conservation</h3>\n<p>Les conversations sont conservées tant que le compte existe, ou jusqu&#x27;à ce que vous les supprimiez. Les registres de limite d&#x27;usage sont effacés dans un délai de deux heures. Les données de compte sont conservées jusqu&#x27;à la suppression demandée.</p>\n<h3>6. Vos droits</h3>\n<p>Selon votre lieu de résidence, vous pouvez demander l&#x27;accès, la correction, la suppression et une copie de vos données, et vous opposer au traitement. Les résidents de Californie peuvent savoir quelles données nous collectons et demander leur suppression. Pour exercer vos droits, écrivez à [E-MAIL DE CONTATO]. Nous ne vous traiterons pas de manière discriminatoire pour avoir exercé ces droits.</p>\n<h3>7. Enfants</h3>\n<p>Monsei n&#x27;est pas destiné aux personnes de moins de 13 ans (ou de l&#x27;âge minimum exigé par la loi locale). Si nous apprenons que nous avons collecté des données d&#x27;un enfant sans l&#x27;autorisation nécessaire, nous supprimerons ces données.</p>\n<h3>8. Sécurité</h3>\n<p>Nous utilisons HTTPS, un contrôle d&#x27;accès par utilisateur et des jetons de session à durée de validité limitée. Aucun système n&#x27;est totalement sûr.</p>\n<h3>9. Modifications</h3>\n<p>Nous publierons les modifications sur le site. Les modifications importantes seront communiquées avant leur entrée en vigueur.</p>\n<h3>10. Contact</h3>\n<p>[E-MAIL DE CONTATO]</p>", "termos": "<h2>Conditions d&#x27;utilisation de Monsei (autres pays)</h2>\n<p>Dernière mise à jour : [DATA]</p>\n<p>En utilisant Monsei, vous acceptez les présentes conditions.</p>\n<h3>1. Le service</h3>\n<p>Monsei donne accès à des modèles d&#x27;intelligence artificielle pour converser, répondre à vos questions et rechercher des informations. Le service peut être modifié ou devenir indisponible.</p>\n<h3>2. Compte</h3>\n<p>Vous vous connectez avec votre adresse e-mail, au moyen d&#x27;un code de vérification. Vous êtes responsable de ce qui se passe sur votre compte.</p>\n<h3>3. Utilisation acceptable</h3>\n<p>N&#x27;utilisez pas Monsei pour créer ou distribuer des logiciels malveillants, attaquer des systèmes de tiers, commettre des fraudes, porter atteinte aux droits d&#x27;autrui, générer des contenus illicites ou contourner les limites d&#x27;utilisation.</p>\n<h3>4. Réponses de l&#x27;IA</h3>\n<p>Les réponses peuvent contenir des erreurs ou être obsolètes, et ne remplacent pas un avis médical, juridique, financier ou professionnel. Vérifiez les informations importantes auprès de sources officielles.</p>\n<h3>5. Contenu</h3>\n<p> ie nicht zustimmen, nutzen Sie den Dienst bitte nicht.</p>\n<h3>1. Der Dienst</h3>\n<p>Monsei bietet Zugang zu Modellen der künstlichen Intelligenz zum Chatten, zur Klärung von Fragen und zur Recherche von Informationen. Der Dienst kann sich ändern, eingeschränkt werden oder vorübergehend nicht verfügbar sein.</p>\n<h3>2. Konto und Zugang</h3>\n<p>Sie melden sich mit Ihrer E-Mail-Adresse über einen Bestätigungscode an. Sie sind für alles verantwortlich, was über Ihr Konto geschieht, und müssen [E-MAIL DE CONTATO] benachrichtigen, wenn Sie eine unbefugte Nutzung feststellen.</p>\n<h3>3. Zulässige Nutzung</h3>\n<p>Sie verpflichten sich, Monsei nicht zu nutzen, um:</p>\n<ul>\n<li>Schadsoftware zu erstellen, zu verbreiten oder zu verbessern, Angriffe auf Systeme Dritter oder Betrug zu begehen;</li>\n<li>Rechte anderer Personen zu verletzen, einschließlich Datenschutz- und Urheberrechte;</li>\n<li>rechtswidrige Inhalte, sexuellen Missbrauch von Kindern oder Inhalte zu erzeugen, die zu Gewalt aufrufen;</li>\n<li>den Dienst zu überlasten, die Nutzungsgrenzen zu umgehen oder auf unbefugtem Weg auf das System zuzugreifen.</li>\n</ul>\n<p>Wir können Konten sperren, die gegen diese Regeln verstoßen.</p>\n<h3>4. Antworten der KI</h3>\n<p>Die Antworten werden automatisch erzeugt und können Fehler, veraltete Informationen oder unzutreffende Aussagen enthalten. Sie ersetzen keine medizinische, rechtliche, finanzielle oder fachliche Beratung. Prüfen Sie wichtige Informationen in offiziellen Quellen, bevor Sie Entscheidungen treffen.</p>\n<h3>5. Von Ihnen gesendete und empfangene Inhalte</h3>\n<p>Sie behalten die Rechte an den Inhalten, die Sie senden. Sie gewähren Monsei die erforderliche Lizenz, um Ihre Nachrichten zu verarbeiten und zu speichern, damit Ihr Verlauf angezeigt werden kann.</p>\n<p>Sie dürfen die erhaltenen Antworten verwenden, auch gewerblich, sofern dies dem Gesetz und den Rechten Dritter entspricht.</p>\n<h3>6. Eigentum an Monsei</h3>\n<p>Die Website, die Marke, d
