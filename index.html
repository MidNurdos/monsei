<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Monsei IA — converse com os modelos Monsei.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Monsei">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Monsei</title>
<style>
:root{
  --red:#ff3131;
  --red-dark:#e02424;
  --ink:#000;
  --muted:#6b7280;
  --bar:#f2f2f2;
  --pill:#c9d0da;
  --line:#e5e7eb;
  --err:#b91c1c;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Open Sans",Arial,sans-serif;
  background:#fff;color:var(--ink);
  display:flex;flex-direction:column;overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}

/* ---------- Cabeçalho ---------- */
header{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 12px) 16px 8px;min-height:64px;
}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px}
.icon-btn:active{background:var(--bar)}
.icon-btn svg{width:28px;height:28px;stroke:#000;stroke-width:2.2;stroke-linecap:round;fill:none}
#newBtn{visibility:hidden}
body.has-chat #newBtn{visibility:visible}
.title{
  font-size:.95rem;font-weight:600;color:#333;
  max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;
}

/* ---------- Área principal ---------- */
main{
  flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;padding:8px 20px 16px;
}
.welcome{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:26px;padding-bottom:14vh;
}
.welcome .sun{width:min(70vw,300px);height:auto;display:block}
.welcome h1{font-size:clamp(2rem,9vw,3.4rem);font-weight:400;letter-spacing:-.01em;line-height:1.1}
body.has-chat .welcome{display:none}

#chat{display:none;flex-direction:column;gap:16px;width:100%;max-width:760px;margin:0 auto}
body.has-chat #chat{display:flex}

/* ---------- Mensagens ---------- */
.msg{
  font-size:1rem;line-height:1.55;overflow-wrap:anywhere;
  border-radius:20px;padding:12px 16px;max-width:88%;
}
.msg.user{align-self:flex-end;background:var(--bar);border-bottom-right-radius:6px;white-space:pre-wrap}
.msg.ai,.msg.err{align-self:stretch;max-width:100%;padding:4px 0}
.msg.err{color:var(--err)}
.msg p{margin:0 0 .7em}
.msg p:last-child{margin-bottom:0}
.msg ul,.msg ol{margin:0 0 .7em 1.3em}
.msg li{margin:.25em 0}
.msg li.sub{margin-left:1.1em;list-style:circle}
.msg hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.msg a{color:#4f46e5;word-break:break-all}
.msg strong{
  font-weight:700;
  background:linear-gradient(transparent 62%,#ffd9d9 62%);
}
.msg h2,.msg h3,.msg h4{
  margin:16px 0 8px;line-height:1.3;font-weight:700;
  border-left:4px solid var(--red);padding-left:10px;
}
.msg h2{font-size:1.2rem}
.msg h3{font-size:1.08rem}
.msg h4{font-size:1rem}
.msg .interrupted{font-size:.85rem;font-style:italic;color:var(--muted);margin-top:6px}
.ic{
  font-family:var(--mono);font-size:.88em;background:#eceef2;color:#111;
  padding:1px 6px;border-radius:6px;
}

/* ---------- Ações da resposta (regenerar) ---------- */
.msg-actions{display:flex;gap:8px;align-self:flex-start;margin:-4px 0 0 0}
.act-btn{
  padding:7px 14px;border-radius:999px;background:var(--bar);
  font-size:.84rem;font-weight:600;
}
.act-btn:active{filter:brightness(.94)}
.act-btn:disabled{opacity:.4}

/* ---------- Caixa de código ---------- */
.code-block{
  border-radius:14px;overflow:hidden;background:#0f172a;color:#e2e8f0;
  border:1px solid #1e293b;margin:8px 0;
}
.code-head{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:8px 10px 8px 14px;background:#1e293b;font-size:.82rem;
}
.code-lang{font-weight:700;color:#cbd5e1;letter-spacing:.01em}
.code-lang em{font-weight:400;color:#94a3b8;font-style:italic}
.copy-btn{
  padding:6px 14px;border-radius:999px;background:#334155;color:#f8fafc;
  font-size:.8rem;font-weight:600;flex:0 0 auto;
}
.copy-btn:active{background:#475569}
.code-block pre{margin:0;padding:12px 14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.code-block code{
  font-family:var(--mono);font-size:.85rem;line-height:1.55;white-space:pre;color:inherit;
}

.dots{display:inline-flex;gap:6px;padding:8px 0}
.dots i{width:8px;height:8px;border-radius:50%;background:#9ca3af;animation:blink 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.2s}
.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* ---------- Rodapé / campo de envio ---------- */
footer{flex:0 0 auto;padding:8px 14px calc(env(safe-area-inset-bottom) + 14px)}
.composer{
  max-width:760px;margin:0 auto;background:var(--bar);
  border-radius:34px;padding:14px 14px 12px 22px;
  display:flex;flex-direction:column;gap:4px;
}
#input{
  width:100%;min-height:52px;max-height:170px;resize:none;border:0;outline:none;
  background:transparent;font:inherit;font-size:1.05rem;line-height:1.4;color:var(--ink);padding:6px 0;
}
#input::placeholder{color:#8a8f98}
.composer-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.model-wrap{position:relative;min-width:0}
.model-pill{
  height:40px;padding:0 16px;border-radius:20px;background:var(--pill);
  font-size:.9rem;font-weight:500;white-space:nowrap;
  max-width:200px;overflow:hidden;text-overflow:ellipsis;
}
.model-pill:active{filter:brightness(.95)}
#send{
  width:56px;height:56px;flex:0 0 56px;border-radius:50%;
  background:var(--red);display:grid;place-items:center;
}
#send:active{background:var(--red-dark)}
#send.stop{background:#111}
#send.stop:active{background:#333}
#send svg{width:26px;height:26px;fill:#fff}

/* ---------- Menu do modelo (abre acima do botão) ---------- */
.menu{
  position:absolute;bottom:50px;left:0;min-width:250px;
  background:#fff;
  border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,.18);
  padding:6px;display:none;z-index:20;
}
.menu.open{display:block}
.model-opt{
  display:flex;width:100%;justify-content:space-between;align-items:center;gap:12px;
  padding:12px 14px;border-radius:12px;text-align:left;font-size:.95rem;
}
.model-opt:active{background:var(--bar)}
.model-opt[aria-checked="true"] span{font-weight:700}
.model-opt small{font-size:.78rem;color:var(--muted);white-space:nowrap}

/* ---------- Gaveta lateral ---------- */
.scrim{
  position:fixed;inset:0;background:rgba(0,0,0,.35);
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;
}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;bottom:0;left:0;width:min(84vw,330px);
  background:#fff;
  transform:translateX(-102%);transition:transform .25s ease;z-index:40;
  display:flex;flex-direction:column;gap:12px;
  padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 16px);
  box-shadow:4px 0 24px rgba(0,0,0,.12);
}
.drawer.open{transform:none}
.logo-wrap{height:64px;display:flex;align-items:center;justify-content:flex-start;padding:0 4px}
.logo-wrap img{max-height:64px;max-width:100%;width:auto;height:auto;display:block}
.drawer-item{
  width:100%;text-align:left;padding:12px 14px;border-radius:12px;
  background:var(--bar);font-size:.98rem;font-weight:600;flex:0 0 auto;
}
.drawer-item:active{filter:brightness(.96)}
.drawer-item:disabled{opacity:.4}
.export-row{display:flex;gap:8px;flex:0 0 auto}
.export-row .drawer-item{flex:1;text-align:center;font-size:.88rem;padding:10px 8px}
.drawer h3{
  font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
  font-weight:600;margin:6px 4px 0;flex:0 0 auto;
}
.search{
  width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);
  font:inherit;font-size:.92rem;outline:none;flex:0 0 auto;
}
.search:focus{border-color:#9ca3af}
.history{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:4px;-webkit-overflow-scrolling:touch}
.hist-row{display:flex;align-items:center;gap:4px;border-radius:12px}
.hist-row.active{background:var(--bar)}
.hist-open{
  flex:1;min-width:0;text-align:left;padding:11px 12px;border-radius:12px;
  font-size:.93rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.hist-open:active{background:var(--bar)}
.hist-del{
  width:36px;height:36px;flex:0 0 36px;border-radius:50%;font-size:1.3rem;line-height:1;color:var(--muted);
}
.hist-del:active{background:#e5e7eb}
.empty{font-size:.9rem;color:var(--muted);padding:8px 12px}
#drawerModels{display:flex;flex-direction:column;gap:2px;flex:0 0 auto}
#drawerModels .model-opt{padding:10px 12px}

.legal-links{margin-top:auto;font-size:.8rem;color:var(--muted);text-align:center;padding-top:8px}
.legal-links a{color:var(--muted)}

/* ---------- Visual de vidro: só em iPhone, iPad e Mac ---------- */
html.apple-glass .composer{
  background:rgba(242,242,242,.72);
  -webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);
  border:1px solid rgba(255,255,255,.7);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 10px 30px rgba(0,0,0,.08);
}
html.apple-glass .menu{
  background:rgba(255,255,255,.8);
  -webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  border:1px solid rgba(255,255,255,.7);
}
html.apple-glass .drawer{
  background:rgba(255,255,255,.78);
  -webkit-backdrop-filter:saturate(180%) blur(26px);backdrop-filter:saturate(180%) blur(26px);
  border-right:1px solid rgba(255,255,255,.7);
}

/* ---------- Animação de envio ---------- */
.ghost{
  position:fixed;margin:0;z-index:60;pointer-events:none;overflow:hidden;
  background:var(--bar);font-size:1rem;line-height:1.55;color:var(--ink);
  padding:12px 16px;border-radius:34px;white-space:pre-wrap;overflow-wrap:anywhere;
  box-shadow:0 6px 18px rgba(0,0,0,.08);
}

/* ---------- Conta e login ---------- */
.account{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
.acc-info{font-size:.82rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.account .act-btn{align-self:flex-start}
.auth{
  position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;
  align-items:center;justify-content:center;padding:20px;z-index:70;
}
.auth.open{display:flex}
.auth-card{
  background:#fff;border-radius:24px;padding:28px 22px 22px;width:100%;max-width:380px;
  text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25);border-top:6px solid var(--red);
}
.auth-logo{width:180px;max-width:70%;height:auto;display:block;margin:0 auto 12px}
.auth h2{font-size:1.2rem;margin-bottom:6px}
.auth-hint{font-size:.9rem;color:var(--muted);margin-bottom:16px;line-height:1.5}
.auth input{
  width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);
  font:inherit;font-size:1.05rem;margin-bottom:10px;text-align:center;
}
.auth input:focus{outline:none;border-color:var(--red)}
.auth-btn{width:100%;padding:14px;border-radius:14px;background:var(--red);color:#fff;font-weight:700;font-size:1rem}
.auth-btn:active{background:var(--red-dark)}
.auth-btn:disabled,.auth-link:disabled{opacity:.5}
.auth-link{margin-top:12px;color:var(--muted);font-size:.9rem}
.auth-error{color:var(--err);font-size:.88rem;min-height:1.3em;margin-top:10px}

/* ---------- Aviso ---------- */
#toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 130px);
  transform:translate(-50%,10px);background:#111;color:#fff;
  padding:10px 16px;border-radius:12px;font-size:.9rem;text-align:center;
  max-width:88vw;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:50;
}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>

function testStorage() {
  try {
    localStorage.setItem("monsei.test", "1");

  } catch {

}
function readStore(key) {
  try { return localStorage.getItem(key); } catch { storageOk = false; return null; }
}
function writeStore(key, value) {
  try {
    localStorage.setItem(key, value);
    return true;
  } catch (e) {
    storageOk = false;
    if (e && e.name === "QuotaExceededError") {
      toast("Armazenamento cheio. Apague conversas antigas para continuar salvando.");
    }
    return false;
  }
}

    return list.filter((c) => c && c.id && Array.isArray(c.messages));

}

async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch {}
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    ta.remove();
    return ok;
  } catch {
    return false;
  }
}

/* ---------- Formatação das respostas (Markdown seguro) ---------- */
function esc(s) {
  return String(s)
    .replace(/\u0001/g, "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function inline(s) {
  const codes = [];
  // código entre crases primeiro, para não formatar o que está dentro
  s = s.replace(/`([^`\n]+)`/g, (_, c) => {
    codes.push(c);
    return "\u0001" + (codes.length - 1) + "\u0001";
  });
  s = s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  s = s.replace(/\*\*(?=\S)([^\n]*?\S)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/__(?=\S)([^\n]*?\S)__/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*\w])\*(?=\S)([^*\n]*?\S)\*(?![*\w])/g, "$1<em>$2</em>");
  s = s.replace(/\u0001(\d+)\u0001/g, (_, i) => '<code class="ic">' + codes[i] + "</code>");
  return s;
}

const LANG_NAMES = {
  html: "HTML", css: "CSS", javascript: "JavaScript", js: "JavaScript",
  typescript: "TypeScript", ts: "TypeScript", python: "Python", py: "Python",
  json: "JSON", bash: "Bash", sh: "Shell", shell: "Shell", sql: "SQL",
  java: "Java", kotlin: "Kotlin", c: "C", cpp: "C++", "c++": "C++",
  csharp: "C#", cs: "C#", php: "PHP", go: "Go", rust: "Rust", xml: "XML",
  markdown: "Markdown", md: "Markdown", jsx: "JSX", tsx: "TSX"
};

function codeBlock(lang, code, open) {
  const label = LANG_NAMES[(lang || "").toLowerCase()] || lang || "Código";
  const status = open ? ' <em>(gerando…)</em>' : "";
  return (
    '<div class="code-block">' +
      '<div class="code-head">' +
        '<span class="code-lang">' + esc(label) + status + '</span>' +
        '<button type="button" class="copy-btn">Copiar</button>' +
      '</div>' +
      '<pre><code>' + esc(code.replace(/\n$/, "")) + '</code></pre>' +
    '</div>'
  );
}

function renderMarkdown(src) {
  const lines = String(src || "").replace(/\r\n?/g, "\n").split("\n");
  let out = "";
  let para = [];
  let listType = null;
  let i = 0;

  const flush = () => {
    if (para.length) {
      out += "<p>" + para.map(inline).join("<br>") + "</p>";
      para = [];
    }
  };
  const closeList = () => {
    if (listType) {
      out += "</" + listType + ">";
      listType = null;
    }
  };

  while (i < lines.length) {
    const line = lines[i];

    // bloco de código: abre com ```linguagem e fecha com ```
    const fence = line.match(/^\s*```\s*([\w+#.-]*)\s*$/);
    if (fence) {
      flush();
      closeList();
      const body = [];
      let closed = false;
      i++;
      while (i < lines.length) {
        if (/^\s*```\s*$/.test(lines[i])) {
          closed = true;
          i++;
          break;
        }
        body.push(lines[i]);
        i++;
      }
      out += codeBlock(fence[1], body.join("\n"), !closed);
      continue;
    }

    // títulos (#, ##, ###)
    const heading = line.match(/^\s{0,3}(#{1,6})\s+(.*)$/);
    if (heading) {
      flush();
      closeList();
      const level = heading[1].length;
      const tag = level === 1 ? "h2" : level === 2 ? "h3" : "h4";
      out += "<" + tag + ">" + inline(esc(heading[2].replace(/\s*#+\s*$/, ""))) + "</" + tag + ">";
      i++;
      continue;
    }

    if (/^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/.test(line)) {
      flush();
      closeList();
      out += "<hr>";
      i++;
      continue;
    }

    // listas (com marcador ou numeradas)
    const bullet = line.match(/^(\s*)[-*+]\s+(.*)$/);
    const number = line.match(/^(\s*)(\d+)[.)]\s+(.*)$/);
    if (bullet || number) {
      flush();
      const type = bullet ? "ul" : "ol";
      const m = bullet || number;
      const text = bullet ? m[2] : m[3];
      const indent = m[1].length;
      if (listType !== type) {
        closeList();
        listType = type;
        out += type === "ol" ? '<ol start="' + number[2] + '">' : "<ul>";
      }
      out += (indent >= 2 ? '<li class="sub">' : "<li>") + inline(esc(text)) + "</li>";
      i++;
      continue;
    }

    if (!line.trim()) {
      flush();
      closeList();
      i++;
      continue;
    }

    closeList();
    para.push(esc(line));
    i++;
  }

  flush();
  closeList();
  return out;
}

      note.textContent = "Resposta interrompida.";
      el.appendChild(note);

}

/* ---------- Renderização da conversa ---------- */
function renderChat() {
  chat.innerHTML = "";
  const conv = currentConv();
  const live = state.live && conv && state.live.convId === conv.id ? state.live : null;

  document.body.classList.toggle("has-chat", Boolean(conv && (conv.messages.length || live)));
  titleEl.textContent = state.model ? state.model.name : "Monsei";

  const hasMessages = Boolean(conv && conv.messages.length);
  exportMd.disabled = !hasMessages;
  exportJson.disabled = !hasMessages;

  if (!conv) return;

  const lastIdx = conv.messages.length - 1;
  conv.messages.forEach((m, idx) => {
    chat.appendChild(makeBubble(m));
    if (m.role !== "ai") return;

    const row = document.createElement("div");
    row.className = "msg-actions";

    if (idx === lastIdx && !live && !state.busy) {
      const regen = document.createElement("button");
      regen.type = "button";
      regen.className = "act-btn regen-btn";
      regen.textContent = "↻ Regenerar";
      row.appendChild(regen);
    }

    const report = document.createElement("button");
    report.type = "button";
    report.className = "act-btn report-btn";
    report.dataset.idx = String(idx);
    report.textContent = "⚑ Denunciar";
    row.appendChild(report);

    chat.appendChild(row);
  });

  if (live) {
    const el = makeBubble({ role: "ai", text: "" });
    if (live.text) el.innerHTML = renderMarkdown(live.text);
    else showDots(el);
    chat.appendChild(el);
    live.el = el;
  }

  scrollDown();
}

function renderHistory() {
  historyList.innerHTML = "";
  const query = searchInput.value.trim().toLowerCase();
  const list = [...state.conversations]
    .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))
    .filter((conv) => {
      if (!query) return true;
      if ((conv.title || "").toLowerCase().includes(query)) return true;
      return conv.messages.some((m) => (m.text || "").toLowerCase().includes(query));
    });

  if (!list.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = query ? "Nenhuma conversa encontrada." : "Nenhuma conversa ainda.";
    historyList.appendChild(p);
    return;
  }

  list.forEach((conv) => {
    const row = document.createElement("div");
    row.className = "hist-row" + (conv.id === state.currentId ? " active" : "");

    const open = document.createElement("button");
    open.type = "button";
    open.className = "hist-open";
    open.textContent = conv.title || "Nova conversa";
    open.addEventListener("click", () => openConversation(conv.id));

    const del = document.createElement("button");
    del.type = "button";
    del.className = "hist-del";
    del.setAttribute("aria-label", "Excluir conversa");
    del.textContent = "×";
    del.addEventListener("click", (event) => {
      event.stopPropagation();
      deleteConversation(conv.id);
    });

    row.append(open, del);
    historyList.appendChild(row);
  });
}

function reportMessage(idx) {
  const conv = currentConv();
  const msg = conv && conv.messages[idx];
  if (!msg) return;

  if (!REPORT_EMAIL) {
    toast("Canal de denúncia ainda não configurado.");
    return;
  }

  const prev = conv.messages[idx - 1];
  const question = prev && prev.role === "user" ? prev.text : "";
  const subject = "Denúncia de resposta - Monsei";
  const body =
    "Motivo da denúncia (descreva o problema):\n\n\n" +
    "---\nPergunta:\n" + question.slice(0, 1000) +
    "\n\nResposta denunciada:\n" + msg.text.slice(0, 1500) +
    "\n\nData: " + new Date().toLocaleString("pt-BR");

  window.location.href =
    "mailto:" + REPORT_EMAIL +
    "?subject=" + encodeURIComponent(subject) +
    "&body=" + encodeURIComponent(body);
}

/* ---------- Exportação ---------- */
function safeName(s) {
  return (s || "conversa").replace(/[\\/:*?"<>|]+/g, "").trim().slice(0, 60) || "conversa";
}

function toMarkdown(conv) {
  const lines = ["# " + conv.title, ""];
  conv.messages.forEach((m) => {
    const who = m.role === "user" ? "**Você**" : m.role === "ai" ? "**Monsei**" : "**Erro**";
    lines.push(who + ":", "", m.text, "");
  });
  return lines.join("\n");
}

function downloadFile(name, content, mime) {
  try {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch {
    toast("Não foi possível exportar neste navegador.");
  }
}

function exportConversation(format) {
  const conv = currentConv();
  if (!conv || !conv.messages.length) {
    toast("Nada para exportar.");
    return;
  }
  if (format === "md") {
    downloadFile(safeName(conv.title) + ".md", toMarkdown(conv), "text/markdown;charset=utf-8");
  } else {
    const data = {
      title: conv.title,
      updatedAt: conv.updatedAt,
      messages: conv.messages.map((m) => ({ role: m.role, text: m.text }))
    };
    downloadFile(safeName(conv.title) + ".json", JSON.stringify(data, null, 2), "application/json;charset=utf-8");
  }
}

/* ---------- Conta: login por código de e-mail (Supabase) ---------- */
class AuthError extends Error {}

const EMAIL_REASONS = {
  invalid: "Digite um e-mail válido.",
  disposable: "Use um e-mail que não seja temporário.",
  "no-mail-server": "Este domínio não recebe e-mails. Confira o endereço."
};

let pendingEmail = "";

function loadSession() {
  try {
    const s = JSON.parse(readStore(SESSION_KEY) || "null");
    return s && s.access_token ? s : null;
  } catch {
    return null;
  }
}

function sessionFrom(data, email) {
  return {
    access_token: data.access_token,
    refresh_token: data.refresh_token,
    expires_at: Math.floor(Date.now() / 1000) + (data.expires_in || 3600),
    email: (data.user && data.user.email) || email,
    user_id: data.user && data.user.id
  };
}

function saveSession(s) {
  state.session = s;
  if (s) writeStore(SESSION_KEY, JSON.stringify(s));
  else { try { localStorage.removeItem(SESSION_KEY); } catch {} }
  renderAccount();
}

async function getAccessToken() {
  const s = state.session;
  if (!s) throw new AuthError("Entre na sua conta para conversar.");
  if (s.expires_at - Date.now() / 1000 > 60) return s.access_token;

  const res = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=refresh_token", {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: SUPABASE_KEY },
    body: JSON.stringify({ refresh_token: s.refresh_token })
  });
  if (!res.ok) {
    saveSession(null);
    throw new AuthError("Sua sessão expirou. Entre de novo.");
  }
  const next = sessionFrom(await res.json(), s.email);
  saveSession(next);
  return next.access_token;
}

async function readApiError(res) {
  const body = await res.text().catch(() => "");
  try {
    const j = JSON.parse(body);
    if (j.error) return j.error;
  } catch {}
  return "Erro " + res.status + (body ? ": " + body.slice(0, 200) : "");
}

async function sendCode(email) {
  const check = await fetch(WORKER_URL + "/check-email", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email })
  });
  const info = await check.json().catch(() => ({}));
  if (!check.ok || !info.ok) {
    throw new AuthError(EMAIL_REASONS[info.reason] || "Não foi possível verificar este e-mail.");
  }

  const res = await fetch(SUPABASE_URL + "/auth/v1/otp", {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: SUPABASE_KEY },
    body: JSON.stringify({ email, create_user: true })
  });
  if (!res.ok) throw new AuthError("Não foi possível enviar o código. Tente de novo em instantes.");
}

async function verifyCode(email, token) {
  const res = await fetch(SUPABASE_URL + "/auth/v1/verify", {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: SUPABASE_KEY },
    body: JSON.stringify({ email, token, type: "email" })
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok || !data.access_token) throw new AuthError("Código inválido ou expirado.");
  saveSession(sessionFrom(data, email));
}

/* ---------- Histórico na nuvem (Supabase) ---------- */
async function pullRemote() {
  try {
    const token = await getAccessToken();
    const res = await fetch(
      SUPABASE_URL + "/rest/v1/conversations?select=id,title,messages,updated_at&order=updated_at.desc",
      { headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + token } }
    );
    if (!res.ok) return;
    const rows = await res.json();
    const remoteIds = new Set(rows.map((r) => r.id));

    rows.forEach((row) => {
      const updated = Date.parse(row.updated_at) || 0;
      const local = state.conversations.find((c) => c.id === row.id);
      if (!local) {
        state.conversations.push({ id: row.id, title: row.title, updatedAt: updated, messages: row.messages || [] });
      } else if (updated > (local.updatedAt || 0)) {
        local.title = row.title;
        local.messages = row.messages || [];
        local.updatedAt = updated;
      }
    });

    // conversas feitas neste aparelho antes do login sobem para a conta
    state.conversations.filter((c) => !remoteIds.has(c.id)).forEach(syncConversation);

    persist();
    renderChat();
    renderHistory();
  } catch (err) {
    console.warn("Sincronização:", err);
  }
}

async function syncConversation(conv) {
  if (!state.session || !conv) return;
  try {
    const token = await getAccessToken();
    await fetch(SUPABASE_URL + "/rest/v1/conversations?on_conflict=user_id,id", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        apikey: SUPABASE_KEY,
        Authorization: "Bearer " + token,
        Prefer: "resolution=merge-duplicates"
      },
      body: JSON.stringify([{
        id: conv.id,
        user_id: state.session.user_id,
        title: conv.title,
        messages: conv.messages,
        updated_at: new Date(conv.updatedAt || Date.now()).toISOString()
      }])
    });
  } catch (err) {
    console.warn("Sincronização:", err);
  }
}

async function deleteRemote(id) {
  if (!state.session) return;
  try {
    const token = await getAccessToken();
    await fetch(SUPABASE_URL + "/rest/v1/conversations?id=eq." + encodeURIComponent(id), {
      method: "DELETE",
      headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + token }
    });
  } catch (err) {
    console.warn("Sincronização:", err);
  }
}

async function readErrorBody(response) {
  try {
    const text = (await response.text()).slice(0, 200);
    return text ? ": " + text : "";
  } catch {
    return "";
  }
}

async function askModel(model, text, onPartial, signal) {
  const callUrl = WORKER_URL + "/gradio/" + model.id + "/call/" + model.fn;
  const token = await getAccessToken();

  // 1) envia a pergunta (pelo Worker) e recebe um event_id
  const submit = await fetch(callUrl, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Accept": "application/json", "Authorization": "Bearer " + token },
    body: JSON.stringify({ data: [text] }),
    signal
  });

  if (!submit.ok) {
    const detail = await readApiError(submit);
    if (submit.status === 401) throw new AuthError(detail);
    throw new Error(detail);
  }

  const job = await submit.json();
  if (!job.event_id) {
    throw new Error("O servidor não retornou um ID de evento.");
  }

  // 2) lê o stream SSE com o resultado
  const result = await fetch(callUrl + "/" + encodeURIComponent(job.event_id), {
    headers: { "Accept": "text/event-stream", "Authorization": "Bearer " + token },
    signal
  });

  if (!result.ok) {
    throw new Error("Falha ao obter a resposta: HTTP " + result.status);
  }
  if (!result.body) {
    throw new Error("Este navegador não suporta streaming de resposta.");
  }

  const reader = result.body.getReader();
  const decoder = new TextDecoder("utf-8");
  let buffer = "";
  let latest = "";

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;

    buffer += decoder.decode(value, { stream: true });
    const events = buffer.split("\n\n");
    buffer = events.pop() || "";

    for (const block of events) {
      let eventName = "";
      let dataText = "";

      for (const line of block.split("\n")) {
        if (line.startsWith("event:")) eventName = line.slice(6).trim();
        else if (line.startsWith("data:")) dataText += (dataText ? "\n" : "") + line.slice(5).replace(/^ /, "");
      }

      if (!dataText) continue;

      if (eventName === "error") {
        throw new Error(dataText);
      }

      if (eventName === "generating" || eventName === "complete") {
        let payload;
        try { payload = JSON.parse(dataText); } catch { continue; }

        const first = Array.isArray(payload) ? payload[0] : null;
        if (first !== null && first !== undefined) {
          latest = String(first);
          if (onPartial) onPartial(latest.trim());
        }

        if (eventName === "complete") {
          return latest.trim();
        }
      }
    }
  }

  if (latest.trim()) return latest.trim();
  throw new Error("A conexão foi encerrada sem uma resposta completa.");
}

/* ---------- Animação: o texto sai do campo e vai para o chat ---------- */
function flyMessage(text, from) {
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const bubbles = chat.querySelectorAll(".msg.user");
  const target = bubbles[bubbles.length - 1];
  if (reduce || !target || !from || !from.width) return;

  const to = target.getBoundingClientRect();
  const ghost = document.createElement("div");
  ghost.className = "ghost";
  ghost.textContent = text;
  ghost.style.left = from.left + "px";
  ghost.style.top = from.top + "px";
  ghost.style.width = from.width + "px";
  document.body.appendChild(ghost);

  target.style.visibility = "hidden";
  const anim = ghost.animate(
    [
      { left: from.left + "px", top: from.top + "px", width: from.width + "px", opacity: 1, borderRadius: "34px" },
      { left: to.left + "px", top: to.top + "px", width: to.width + "px", opacity: 0.6, borderRadius: "20px" }
    ],
    { duration: 520, easing: "cubic-bezier(.2,.8,.2,1)", fill: "forwards" }
  );
  const done = () => {
    ghost.remove();
    target.style.visibility = "";
  };
  anim.onfinish = done;
  anim.oncancel = done;
}

/* ---------- Envio, parada e regeneração ---------- */
async function sendMessage() {
  if (state.busy) return;

  const text = input.value.trim();
  if (!text) return;

  if (!state.model) {
    toast("Escolha um modelo primeiro.");
    return;
  }
  if (!state.session) {
    showAuth();
    return;
  }

  let conv = currentConv();
  if (!conv) {
    conv = { id: newId(), title: "Nova conversa", updatedAt: Date.now(), messages: [] };
    state.conversations.push(conv);
    state.currentId = conv.id;
  }
  if (conv.messages.length === 0) conv.title = makeTitle(text);

  conv.messages.push({ role: "user", text });
  conv.updatedAt = Date.now();

  const from = input.getBoundingClientRect();
  input.value = "";
  autosize();

  // runRequest já desenha a mensagem do usuário antes de esperar a resposta
  const pending = runRequest(conv.id, text);
  flyMessage(text, from);
  await pending;
}

function regenerate() {
  if (state.busy) return;
  const conv = currentConv();
  if (!conv) return;

  const msgs = conv.messages;
  // remove a última resposta (e qualquer erro depois da pergunta)
  while (msgs.length && msgs[msgs.length - 1].role !== "user") msgs.pop();
  const lastUser = msgs[msgs.length - 1];
  if (!lastUser) return;

  conv.updatedAt = Date.now();
  runRequest(conv.id, lastUser.text);
}

function stopGeneration() {
  if (!state.busy || !state.controller) return;
  state.stopping = true;
  state.controller.abort();
}

async function runRequest(convId, text) {
  const model = state.model;
  persist();

  state.busy = true;
  state.stopping = false;
  setSendMode(true);

  const controller = new AbortController();
  state.controller = controller;
  const live = { convId, el: null, text: "" };
  state.live = live;

  renderChat();
  renderHistory();

  const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);

  let role = "ai";
  let answer = "";
  let interrupted = false;

  try {
    answer = await askModel(model, text, (partial) => {
      live.text = partial;
      if (live.el && live.el.isConnected) {
        const nearBottom = main.scrollHeight - main.scrollTop - main.clientHeight < 120;
        live.el.innerHTML = renderMarkdown(partial);
        if (nearBottom) scrollDown();
      }
    }, controller.signal);

    if (!answer) throw new Error("O modelo retornou uma resposta vazia.");
  } catch (error) {
    if (state.stopping) {
      // parada pelo usuário: mantém o que já chegou
      interrupted = true;
      answer = live.text;
    } else {
      console.error("Monsei:", error);
      if (error instanceof AuthError) showAuth();
      role = "err";
      answer = error.name === "AbortError"
        ? "O tempo de resposta esgotou. Tente novamente."
        : "Erro: " + (error.message || String(error));
    }
  } finally {
    clearTimeout(timer);
  }

  const target = state.conversations.find((c) => c.id === convId);
  if (target) {
    const entry = { role, text: answer || (interrupted ? "" : answer) };
    if (interrupted) entry.interrupted = true;
    target.messages.push(entry);
    target.updatedAt = Date.now();
  }
  persist();

  if (target) syncConversation(target);

  state.live = null;
  state.busy = false;
  state.stopping = false;
  state.controller = null;
  setSendMode(false);

  if (state.currentId === convId) renderChat();
  renderHistory();
}

/* ---------- Seleção de modelo ---------- */
function selectModel(model) {
  state.model = model;
  writeStore(MODEL_KEY, model.id);
  refreshModelUI();
}

function refreshModelUI() {
  const current = state.model;
  pill.textContent = current ? current.name : "Selecionar modelo";
  titleEl.textContent = current ? current.name : "Monsei";
  buildModelButtons(menu, () => toggleMenu(false));
  buildModelButtons(drawerModels, () => openDrawer(false));
}

function buildModelButtons(container, afterPick) {
  container.innerHTML = "";

  MODELS.forEach((model) => {
    const available = true;
    const button = document.createElement("button");
    button.type = "button";
    button.className = "model-opt";
    button.setAttribute("role", "menuitemradio");
    button.setAttribute("aria-checked", String(state.model?.id === model.id));
    button.disabled = !available;

    const name = document.createElement("span");
    name.textContent = model.name;

    const tag = document.createElement("small");
    tag.textContent = available ? model.level : "Em breve";

    button.append(name, tag);
    button.addEventListener("click", () => {
      selectModel(model);
      if (afterPick) afterPick();
    });

    container.appendChild(button);
  });
}

/* ---------- Menu do modelo ---------- */
function toggleMenu(force) {
  const open = typeof force === "boolean" ? force : !menu.classList.contains("open");
  menu.classList.toggle("open", open);
  pill.setAttribute("aria-expanded", String(open));
}

pill.addEventListener("click", (event) => {
  event.stopPropagation();
  toggleMenu();
});

document.addEventListener("click", (event) => {
  if (!menu.contains(event.target) && event.target !== pill) {
    toggleMenu(false);
  }
});

/* ---------- Gaveta lateral ---------- */
function openDrawer(open) {
  drawer.classList.toggle("open", open);
  scrim.classList.toggle("open", open);
}

$("menuBtn").addEventListener("click", () => openDrawer(true));
scrim.addEventListener("click", () => openDrawer(false));
$("newBtn").addEventListener("click", newChat);
$("drawerNew").addEventListener("click", newChat);
exportMd.addEventListener("click", () => exportConversation("md"));
exportJson.addEventListener("click", () => exportConversation("json"));
searchInput.addEventListener("input", renderHistory);

/* ---------- Eventos de conta e login ---------- */
$("account").addEventListener("click", (event) => {
  const action = event.target.closest("[data-action]")?.dataset.action;
  if (action === "login") {
    openDrawer(false);
    showAuth();
  } else if (action === "logout") {
    logout();
  }
});

$("emailForm").addEventListener("submit", async (event) => {
  event.preventDefault();
  const email = $("authEmail").value.trim().toLowerCase();
  setAuthBusy(true);
  setAuthError("");
  try {
    await sendCode(email);
    pendingEmail = email;
    showCodeStep();
  } catch (err) {
    setAuthError(err.message || "Erro ao enviar o código.");
  } finally {
    setAuthBusy(false);
  }
});

$("codeForm").addEventListener("submit", async (event) => {
  event.preventDefault();
  setAuthBusy(true);
  setAuthError("");
  try {
    await verifyCode(pendingEmail, $("authCode").value.trim());
    hideAuth();
    toast("Conectado!");
    pullRemote();
  } catch (err) {
    setAuthError(err.message || "Erro ao entrar.");
  } finally {
    setAuthBusy(false);
  }
});

$("changeEmailBtn").addEventListener("click", showEmailStep);

/* ---------- Botões dentro da conversa (copiar código e regenerar) ---------- */
chat.addEventListener("click", async (event) => {
  const regen = event.target.closest(".regen-btn");
  if (regen) {
    regenerate();
    return;
  }
  const report = event.target.closest(".report-btn");
  if (report) {
    reportMessage(Number(report.dataset.idx));
    return;
  }
  const btn = event.target.closest(".copy-btn");
  if (!btn) return;
  const code = btn.closest(".code-block").querySelector("code").textContent;
  const ok = await copyText(code);
  btn.textContent = ok ? "Copiado!" : "Não copiou";
  setTimeout(() => { btn.textContent = "Copiar"; }, 1600);
});

/* ---------- Campo de texto e botão de envio/parada ---------- */
sendBtn.addEventListener("click", () => {
  if (state.busy) stopGeneration();
  else sendMessage();
});
input.addEventListener("input", autosize);

input.addEventListener("keydown", (event) => {
  // No computador, Enter envia e Shift+Enter quebra linha.
  // No celular, Enter quebra linha (envie pelo botão).
  if (event.key === "Enter" && !event.shiftKey && !isTouch) {
    event.preventDefault();
    sendMessage();
  }
});

/* ---------- Atalhos de teclado ---------- */
document.addEventListener("keydown", (event) => {
  const mod = event.ctrlKey || event.metaKey;
  if (event.key === "Escape") {
    if (state.busy) stopGeneration();
    openDrawer(false);
    toggleMenu(false);
    return;
  }
  if (mod && event.key.toLowerCase() === "k") {
    event.preventDefault();
    openDrawer(true);
    searchInput.focus();
  } else if (mod && event.key.toLowerCase() === "n") {
    event.preventDefault();
    newChat();
  }
});

/* ---------- Inicialização ---------- */
(function init() {
  storageOk = testStorage();

  state.conversations = loadConversations();
  const savedCurrent = readStore(CUR_KEY);
  state.currentId = state.conversations.some((c) => c.id === savedCurrent) ? savedCurrent : null;

  const savedModelId = readStore(MODEL_KEY);
  state.model = MODELS.find((m) => m.id === savedModelId) || MODELS[0];

  state.session = loadSession();
  refreshModelUI();
  setSendMode(false);
  renderAccount();
  renderChat();
  renderHistory();
  autosize();
  if (state.session) pullRemote();
  else setTimeout(showAuth, 300);

  if (!storageOk) {
    setTimeout(() => toast("Este navegador bloqueou o salvamento. Abra pelo Chrome para manter as conversas."), 600);
  }
})();

/* ---------- Modo app (PWA): registra o service worker ---------- */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch((err) => console.warn("SW:", err));
  });
}
</script>
