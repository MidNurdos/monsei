<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff3131">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Monsei">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Monsei</title>
<style>
  :root {
    --red: #ff3131;
    --red-2: #e02424;
    --ink: #111418;
    --muted: #6b7280;
    --line: #e7e9ee;
    --bg: #ffffff;
    --panel: #f6f7f9;
    --user-bubble: #ff3131;
    --code-bg: #0f172a;
    --code-head: #1e293b;
    --radius: 18px;
    --shadow: 0 10px 30px rgba(15, 23, 42, .10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #f3f4f6;
      --muted: #9aa3b2;
      --line: #262b36;
      --bg: #0d1017;
      --panel: #151a23;
      --shadow: 0 10px 30px rgba(0, 0, 0, .45);
    }
  }
  :root[data-theme="dark"] {
    --ink: #f3f4f6;
    --muted: #9aa3b2;
    --line: #262b36;
    --bg: #0d1017;
    --panel: #151a23;
    --shadow: 0 10px 30px rgba(0, 0, 0, .45);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }

  /* ---------- layout ---------- */
  .app { display: flex; height: 100dvh; width: 100%; }

  .sidebar {
    position: fixed; inset: 0 auto 0 0; width: 300px; max-width: 86vw;
    background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; padding: 14px;
    transform: translateX(-102%); transition: transform .28s cubic-bezier(.2,.8,.2,1);
    z-index: 40; padding-bottom: max(14px, env(safe-area-inset-bottom));
    padding-top: max(14px, env(safe-area-inset-top));
  }
  .sidebar.open { transform: none; box-shadow: var(--shadow); }
  .scrim {
    position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 35;
    opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  .scrim.show { opacity: 1; pointer-events: auto; }

  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; height: 100dvh; }

  @media (min-width: 960px) {
    .sidebar { position: relative; transform: none; inset: auto; max-width: none; flex: 0 0 280px; z-index: 1; }
    .scrim { display: none; }
    .menu-btn { display: none !important; }
  }

  /* ---------- barra superior ---------- */
  .topbar {
    display: flex; align-items: center; gap: 8px;
    padding: max(10px, env(safe-area-inset-top)) 12px 10px;
    border-bottom: 1px solid var(--line); background: var(--bg);
    position: sticky; top: 0; z-index: 10;
  }
  .topbar .title { flex: 1; min-width: 0; font-weight: 600; font-size: 16px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
  .icon-btn {
    width: 40px; height: 40px; border: 0; border-radius: 12px; background: transparent;
    display: grid; place-items: center; color: var(--ink); flex: 0 0 auto;
  }
  .icon-btn:hover, .icon-btn:focus-visible { background: var(--panel); outline: none; }
  .icon-btn svg { width: 22px; height: 22px; }

  .model-btn {
    display: flex; align-items: center; gap: 6px; border: 1px solid var(--line);
    background: var(--bg); border-radius: 999px; padding: 6px 12px 6px 10px;
    font-size: 14px; font-weight: 600; max-width: 56vw; position: relative;
  }
  .model-btn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); flex: 0 0 auto; }
  .model-btn .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .model-btn .chev { width: 14px; height: 14px; opacity: .6; flex: 0 0 auto; }

  .menu {
    position: absolute; top: calc(100% + 8px); right: 0; min-width: 240px; max-width: 86vw;
    background: var(--bg); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow);
    padding: 6px; z-index: 30; text-align: left;
  }
  .menu button {
    display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 12px;
    background: none; border: 0; padding: 10px 12px; border-radius: 10px; text-align: left; color: var(--ink);
  }
  .menu button:hover, .menu button:focus-visible { background: var(--panel); outline: none; }
  .menu button small { color: var(--muted); font-size: 12px; }
  .menu .check { color: var(--red); font-weight: 700; }
  .menu .sep { height: 1px; background: var(--line); margin: 6px 4px; }
  .menu .danger { color: #dc2626; }

  /* ---------- conversa ---------- */
  .chat { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 20px 16px 8px; }
  .chat-inner { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

  .hero { text-align: center; padding: 36px 0 12px; animation: rise .5s ease both; }
  .hero img { width: 84px; height: 84px; object-fit: contain; }
  .hero h1 { font-size: 28px; margin: 14px 0 6px; letter-spacing: -.01em; }
  .hero p { color: var(--muted); margin: 0 0 22px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .chip {
    border: 1px solid var(--line); background: var(--bg); border-radius: 999px;
    padding: 9px 14px; font-size: 14px; color: var(--ink);
  }
  .chip:hover { border-color: var(--red); color: var(--red); }

  .msg { display: flex; gap: 12px; animation: rise .32s cubic-bezier(.2,.8,.2,1) both; }
  .msg.user { justify-content: flex-end; }
  .msg.user .bubble {
    background: var(--user-bubble); color: #fff; padding: 11px 16px;
    border-radius: 20px 20px 6px 20px; max-width: min(640px, 84%);
    white-space: pre-wrap; word-wrap: break-word; box-shadow: 0 6px 16px rgba(255,49,49,.22);
  }
  .msg.ai .avatar {
    width: 30px; height: 30px; border-radius: 10px; flex: 0 0 auto; margin-top: 2px;
    background: var(--red); display: grid; place-items: center;
  }
  .msg.ai .avatar img { width: 20px; height: 20px; filter: brightness(0) invert(1); }
  .msg.ai .body { min-width: 0; flex: 1; word-wrap: break-word; }
  .msg.err .body { color: #dc2626; }
  .interrupted { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .msg-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .act-btn {
    border: 1px solid var(--line); background: var(--bg); border-radius: 999px;
    padding: 5px 11px; font-size: 13px; color: var(--muted);
  }
  .act-btn:hover { color: var(--ink); border-color: var(--muted); }

  .typing { display: inline-flex; gap: 5px; padding: 8px 2px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.1s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; }
  .typing i:nth-child(3) { animation-delay: .3s; }

  /* markdown */
  .md p { margin: 0 0 12px; }
  .md p:last-child { margin-bottom: 0; }
  .md h2, .md h3, .md h4 { margin: 18px 0 8px; line-height: 1.3; }
  .md h2 { font-size: 21px; } .md h3 { font-size: 18px; } .md h4 { font-size: 16px; }
  .md ul, .md ol { margin: 0 0 12px; padding-left: 22px; }
  .md li { margin: 3px 0; }
  .md blockquote { margin: 10px 0; padding: 4px 14px; border-left: 3px solid var(--red); color: var(--muted); }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
  .md a { color: var(--red); }
  .md code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .9em;
    background: var(--panel); padding: 2px 6px; border-radius: 6px;
  }
  .code {
    margin: 12px 0; border-radius: 14px; overflow: hidden; background: var(--code-bg);
    box-shadow: 0 1px 0 rgba(255,255,255,.04) inset;
  }
  .code-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 8px 8px 14px; background: var(--code-head); color: #cbd5e1; font-size: 13px;
  }
  .code-head span { font-weight: 600; letter-spacing: .02em; }
  .copy-btn {
    border: 0; background: #334155; color: #fff; border-radius: 999px; padding: 5px 12px; font-size: 12.5px;
  }
  .copy-btn:hover { background: #475569; }
  .code pre { margin: 0; padding: 14px; overflow-x: auto; color: #e2e8f0; }
  .code pre code { background: none; padding: 0; font-size: 13.5px; line-height: 1.55; white-space: pre; }

  /* ---------- composer ---------- */
  .composer-wrap { padding: 8px 14px max(12px, env(safe-area-inset-bottom)); background: var(--bg); }
  .composer {
    max-width: 780px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 26px; padding: 8px 8px 8px 16px;
    transition: border-color .2s, box-shadow .2s;
  }
  .composer:focus-within { border-color: var(--red); box-shadow: 0 0 0 4px rgba(255,49,49,.12); }
  .composer textarea {
    flex: 1; border: 0; background: transparent; resize: none; outline: none;
    padding: 9px 0; max-height: 180px; min-height: 24px; font-size: 16px;
  }
  .composer textarea::placeholder { color: var(--muted); }
  .send-btn {
    width: 44px; height: 44px; border: 0; border-radius: 50%; flex: 0 0 auto;
    background: var(--red); color: #fff; display: grid; place-items: center;
    box-shadow: 0 6px 16px rgba(255,49,49,.3); transition: transform .15s, background .2s;
  }
  .send-btn:hover { background: var(--red-2); }
  .send-btn:active { transform: scale(.94); }
  .send-btn:disabled { opacity: .45; box-shadow: none; cursor: default; }
  .send-btn svg { width: 20px; height: 20px; }
  .foot { text-align: center; font-size: 12px; color: var(--muted); margin: 8px 0 0; }

  /* ---------- barra lateral ---------- */
  .side-head { display: flex; align-items: center; gap: 10px; padding: 4px 4px 12px; }
  .side-head img { width: 34px; height: 34px; object-fit: contain; }
  .side-head b { font-size: 18px; letter-spacing: -.01em; }
  .new-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
    border: 0; border-radius: 14px; padding: 11px; background: var(--red); color: #fff; font-weight: 600;
    box-shadow: 0 6px 16px rgba(255,49,49,.25);
  }
  .new-btn:hover { background: var(--red-2); }
  .search {
    margin: 12px 0 8px; width: 100%; border: 1px solid var(--line); background: var(--bg);
    border-radius: 12px; padding: 9px 12px; outline: none;
  }
  .search:focus { border-color: var(--red); }
  .conv-list { flex: 1; overflow-y: auto; margin: 0 -4px; padding: 0 4px; }
  .conv-group { font-size: 12px; color: var(--muted); padding: 12px 8px 6px; text-transform: uppercase; letter-spacing: .04em; }
  .conv {
    display: flex; align-items: center; gap: 6px; border-radius: 12px; padding: 4px 4px 4px 10px; margin-bottom: 2px;
  }
  .conv:hover { background: rgba(127,127,127,.12); }
  .conv.active { background: var(--bg); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .conv .open {
    flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 8px 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .conv .del { opacity: 0; border: 0; background: none; color: var(--muted); padding: 6px 8px; border-radius: 8px; }
  .conv:hover .del, .conv.active .del { opacity: 1; }
  .conv .del:hover { color: #dc2626; }
  .empty-list { color: var(--muted); font-size: 14px; padding: 12px 8px; }

  .side-foot { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 10px; font-size: 14px; }
  .acc-info { display: block; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 8px; }
  .side-links { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 10px; font-size: 12.5px; color: var(--muted); }
  .side-links a { color: var(--muted); }
  .side-foot .row-btn {
    display: block; width: 100%; text-align: left; border: 0; background: var(--bg); border-radius: 12px;
    padding: 10px 12px; margin-bottom: 6px; border: 1px solid var(--line);
  }
  .side-foot .row-btn.primary { background: var(--red); color: #fff; border-color: var(--red); font-weight: 600; }

  /* ---------- login ---------- */
  .auth {
    position: fixed; inset: 0; background: rgba(8,10,14,.55); backdrop-filter: blur(6px);
    display: none; place-items: center; z-index: 60; padding: 20px;
  }
  .auth.open { display: grid; }
  .auth-card {
    width: min(400px, 100%); background: var(--bg); border-radius: 24px; padding: 28px 24px 22px;
    box-shadow: var(--shadow); animation: rise .3s cubic-bezier(.2,.8,.2,1) both; text-align: center;
  }
  .auth-card img { width: 72px; height: 72px; object-fit: contain; }
  .auth-card h2 { margin: 10px 0 4px; font-size: 22px; }
  .auth-card p { margin: 0 0 16px; color: var(--muted); font-size: 14.5px; }
  .auth-card form { display: grid; gap: 10px; }
  .auth-card input {
    width: 100%; border: 1px solid var(--line); background: var(--panel); border-radius: 14px;
    padding: 13px 14px; font-size: 16px; outline: none; text-align: center;
  }
  .auth-card input:focus { border-color: var(--red); }
  .auth-card input.code { letter-spacing: .4em; font-size: 22px; font-weight: 700; }
  .btn-primary {
    border: 0; border-radius: 14px; padding: 13px; background: var(--red); color: #fff; font-weight: 600; font-size: 16px;
  }
  .btn-primary:disabled { opacity: .6; }
  .btn-ghost { border: 0; background: none; color: var(--muted); padding: 8px; font-size: 14px; }
  .auth-error { color: #dc2626; font-size: 14px; min-height: 20px; margin-top: 10px; }

  /* ---------- aviso ---------- */
  .toast {
    position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px);
    background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 14px; font-size: 14px;
    opacity: 0; transition: .25s; pointer-events: none; z-index: 80; max-width: 90vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  @media (max-width: 520px) {
    .model-btn .name { max-width: 34vw; }
    .hero h1 { font-size: 24px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  /* ---------- Liquid Glass (só Apple) ---------- */
  html.apple-glass .topbar,
  html.apple-glass .composer-wrap,
  html.apple-glass .sidebar,
  html.apple-glass .menu,
  html.apple-glass .auth-card {
    background: rgba(255,255,255,.58) !important;
    backdrop-filter: blur(26px) saturate(180%);
    -webkit-backdrop-filter: blur(26px) saturate(180%);
  }
  html.apple-glass .composer { background: rgba(255,255,255,.55); backdrop-filter: blur(20px) saturate(170%); -webkit-backdrop-filter: blur(20px) saturate(170%); }
  html.apple-glass .topbar { border-bottom-color: rgba(0,0,0,.06); }
  @media (prefers-color-scheme: dark) {
    html.apple-glass:not([data-theme="light"]) .topbar,
    html.apple-glass:not([data-theme="light"]) .composer-wrap,
    html.apple-glass:not([data-theme="light"]) .sidebar,
    html.apple-glass:not([data-theme="light"]) .menu,
    html.apple-glass:not([data-theme="light"]) .auth-card { background: rgba(20,24,33,.6) !important; }
    html.apple-glass:not([data-theme="light"]) .composer { background: rgba(30,36,48,.55); }
  }
</style>
</head>

<script>
/* ---------- aparência ---------- */
(function detectApple() {
  const ua = navigator.userAgent || "";
  const isIpad = /iPad/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const isApple = /iPhone|iPod/.test(ua) || isIpad || /Macintosh/.test(ua);
  if (isApple && !/Android|Windows/.test(ua)) {
    document.documentElement.classList.add("apple-glass");
  }
})();

/* ---------- configuração ---------- */
const WORKER_URL = "https://monsei-api.midnurdos.workers.dev";
const SUPABASE_URL = "https://kokehksuiysowtvqtwno.supabase.co";
const SUPABASE_KEY = "sb_publishable_XrQGdYgmdh-fk3kfWs-n9Q_HgZn7A37"; // chave sb_publishable_... (pode ficar no site)
const REPORT_EMAIL = "monseiapp@gmail.com";                             // e-mail para denúncias
const TIMEOUT_MS = 120000;
const HISTORY_MAX = 12;

const CONV_KEY = "monsei.conversations.v1";
const CUR_KEY = "monsei.current.v1";
const MODEL_KEY = "monsei.model.v2";
const SESSION_KEY = "monsei.session.v1";

const EMAIL_REASONS = {
  invalid: "Digite um e-mail válido.",
  disposable: "Use um e-mail que não seja temporário.",
  "no-mail-server": "Este domínio não recebe e-mails. Confira o endereço."
};

/* ---------- estado ---------- */
const state = {
  conversations: [],
  currentId: null,
  models: [],
  model: null,
  session: null,
  busy: false,
  stopping: false,
  controller: null,
  live: "",
  search: "",
  pendingEmail: ""
};

class AuthError extends Error {}

const $ = (id) => document.getElementById(id);

/* ---------- armazenamento local ---------- */
function readStore(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch { return fallback; }
}
function writeStore(key, value) {
  try { localStorage.setItem(key, typeof value === "string" ? value : JSON.stringify(value)); }
  catch (e) { toast("Não foi possível salvar no aparelho (armazenamento cheio)."); }
}
function persist() {
  writeStore(CONV_KEY, state.conversations);
  if (state.currentId) writeStore(CUR_KEY, state.currentId);
}

/* ---------- conversas ---------- */
function newConversation() {
  const conv = { id: crypto.randomUUID(), title: "Nova conversa", updated_at: Date.now(), messages: [] };
  state.conversations.unshift(conv);
  state.currentId = conv.id;
  return conv;
}
function currentConv() {
  let conv = state.conversations.find((c) => c.id === state.currentId);
  if (!conv) conv = newConversation();
  return conv;
}
function sortConversations() {
  state.conversations.sort((a, b) => b.updated_at - a.updated_at);
}
function titleFrom(text) {
  const first = text.split("\n")[0].trim();
  return first.length > 42 ? first.slice(0, 42) + "…" : first;
}
function lastUserIndex(conv) {
  for (let i = conv.messages.length - 1; i >= 0; i--) if (conv.messages[i].role === "user") return i;
  return -1;
}
function buildHistory(conv, idx) {
  return conv.messages
    .slice(0, idx)
    .filter((m) => (m.role === "user" || m.role === "ai") && m.text)
    .slice(-HISTORY_MAX)
    .map((m) => ({ role: m.role === "ai" ? "assistant" : "user", content: m.text }));
}

/* ---------- markdown seguro ---------- */
function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function inline(text) {
  const codes = [];
  let s = text.replace(/`([^`\n]+)`/g, (_, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
  s = esc(s);
  s = s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g,
    (_, t, u) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${t}</a>`);
  s = s.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, "$1<em>$2</em>");
  s = s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${esc(codes[+i])}</code>`);
  return s;
}
function codeBlock(lang, code) {
  const label = lang ? esc(lang) : "código";
  return `<div class="code"><div class="code-head"><span>${label}</span>` +
         `<button class="copy-btn" type="button" data-copy="${encodeURIComponent(code)}">Copiar</button></div>` +
         `<pre><code>${esc(code)}</code></pre></div>`;
}
function renderMarkdown(src) {
  const lines = String(src || "").replace(/\r\n/g, "\n").split("\n");
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    let m;
    if ((m = line.match(/^\s*```\s*([\w+#.-]*)\s*$/))) {
      const buf = [];
      i++;
      while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      out.push(codeBlock(m[1], buf.join("\n")));
      continue;
    }
    if ((m = line.match(/^(#{1,6})\s+(.*)$/))) {
      const level = Math.min(m[1].length + 1, 4);
      out.push(`<h${level}>${inline(m[2].replace(/\s*#+\s*$/, ""))}</h${level}>`);
      i++; continue;
    }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { out.push("<hr>"); i++; continue; }
    if (/^>\s?/.test(line)) {
      const buf = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^>\s?/, "")); i++; }
      out.push(`<blockquote>${inline(buf.join(" "))}</blockquote>`);
      continue;
    }
    if (/^\s*[-*+]\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) { items.push(lines[i].replace(/^\s*[-*+]\s+/, "")); i++; }
      out.push("<ul>" + items.map((t) => `<li>${inline(t)}</li>`).join("") + "</ul>");
      continue;
    }
    if ((m = line.match(/^\s*(\d+)[.)]\s+/))) {
      const start = parseInt(m[1], 10);
      const items = [];
      while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) { items.push(lines[i].replace(/^\s*\d+[.)]\s+/, "")); i++; }
      out.push(`<ol start="${start}">` + items.map((t) => `<li>${inline(t)}</li>`).join("") + "</ol>");
      continue;
    }
    if (!line.trim()) { i++; continue; }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !/^(\s*```|#{1,6}\s|>\s?|\s*[-*+]\s+|\s*\d+[.)]\s+)/.test(lines[i])) {
      buf.push(lines[i]); i++;
    }
    if (!buf.length) { buf.push(lines[i]); i++; }
    out.push(`<p>${buf.map(inline).join("<br>")}</p>`);
  }
  return out.join("");
}

  const conv = currentConv();
  $("title").textContent = conv.title;
  $("modelName").textContent = state.model ? state.model.name : "Sem modelo";
  renderChat();
  renderList();
  renderAccount();
  setSendMode(state.busy);
}

function renderList() {
  const list = $("convList");
  list.innerHTML = "";
  const q = state.search.trim().toLowerCase();
  const items = state.conversations.filter((c) =>
    !q || c.title.toLowerCase().includes(q) || c.messages.some((m) => m.text.toLowerCase().includes(q)));
  if (!items.length) {
    list.innerHTML = `<div class="empty-list">${q ? "Nenhuma conversa encontrada." : "Suas conversas aparecem aqui."}</div>`;
    return;
  }
  const groups = { "Hoje": [], "Últimos 7 dias": [], "Antigas": [] };
  const day = 86400000;
  items.forEach((c) => {
    const age = Date.now() - c.updated_at;
    if (age < day) groups["Hoje"].push(c);
    else if (age < 7 * day) groups["Últimos 7 dias"].push(c);
    else groups["Antigas"].push(c);
  });
  Object.entries(groups).forEach(([label, convs]) => {
    if (!convs.length) return;
    list.insertAdjacentHTML("beforeend", `<div class="conv-group">${label}</div>`);
    convs.forEach((c) => {
      list.insertAdjacentHTML("beforeend",
        `<div class="conv ${c.id === state.currentId ? "active" : ""}">` +
        `<button class="open" type="button" data-open="${c.id}">${esc(c.title)}</button>` +
        `<button class="del" type="button" data-del="${c.id}" aria-label="Excluir conversa">✕</button></div>`);
    });
  });
}

function renderAccount() {
  const box = $("account");
  box.innerHTML = "";
  if (state.session) {
    box.insertAdjacentHTML("beforeend",
      `<span class="acc-info">${esc(state.session.email)}</span>` +
      `<button class="row-btn" type="button" data-account="logout">Sair da conta</button>`);
  } else {
    box.insertAdjacentHTML("beforeend",
      `<button class="row-btn primary" type="button" data-account="login">Entrar com e-mail</button>`);
  }
}

function renderModelMenu() {
  const menu = $("modelMenu");
  if (!state.models.length) {
    menu.innerHTML = `<button type="button" disabled>Modelos indisponíveis</button>`;
    return;
  }
  menu.innerHTML = state.models.map((m) =>
    `<button type="button" data-model="${esc(m.id)}"><span>${esc(m.name)}<br><small>${esc(m.level)}</small></span>` +
    `<span class="check">${state.model && state.model.id === m.id ? "✓" : ""}</span></button>`).join("");
}

function setSendMode(busy) {
  const btn = $("sendBtn");
  const icon = $("sendIcon");
  if (busy) {
    btn.setAttribute("aria-label", "Parar");
    icon.innerHTML = '<rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" stroke="none"/>';
    btn.disabled = false;
  } else {
    btn.setAttribute("aria-label", "Enviar");
    icon.innerHTML = '<path d="M12 19V5M5 12l7-7 7 7"/>';
    btn.disabled = !$("input").value.trim();
  }
}

/* ---------- menus e gaveta ---------- */
function openSidebar(open) {
  $("sidebar").classList.toggle("open", open);
  $("scrim").classList.toggle("show", open);
}
function closeMenus() {
  ["modelMenu", "moreMenu"].forEach((id) => { $(id).hidden = true; });
  $("modelBtn").setAttribute("aria-expanded", "false");
}
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("show"), 2400);
}

/* ---------- envio e resposta ---------- */
function autoGrow() {
  const input = $("input");
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 180) + "px";
  setSendMode(state.busy);
}

async function sendMessage() {
  if (state.busy) return;
  const input = $("input");
  const text = input.value.trim();
  if (!text) return;
  if (!state.session) { showAuth(); return; }

  input.value = "";
  autoGrow();
  const conv = currentConv();
  conv.messages.push({ role: "user", text });
  if (conv.title === "Nova conversa") conv.title = titleFrom(text);
  conv.updated_at = Date.now();
  sortConversations();
  persist();
  await runRequest(conv);
}

async function regenerate() {
  if (state.busy) return;
  const conv = currentConv();
  while (conv.messages.length && conv.messages[conv.messages.length - 1].role !== "user") conv.messages.pop();
  if (!conv.messages.length) return;
  await runRequest(conv);
}

async function runRequest(conv) {
  const idx = lastUserIndex(conv);
  if (idx < 0) return;
  const text = conv.messages[idx].text;
  const history = [];
  const model = state.model;
  if (!model) { toast("Escolha um modelo."); return; }

  state.busy = true;
  state.stopping = false;
  state.live = "";
  state.controller = new AbortController();
  const timer = setTimeout(() => state.controller.abort(), TIMEOUT_MS);
  renderAll();

  let answer = null, error = null, interrupted = false, needLogin = false;
  try {
    answer = await askModel(model, text, history, (t) => {
      state.live = t;
      if (state.currentId === conv.id) renderChat();
    }, state.controller.signal);
  } catch (e) {
    if (state.stopping) { interrupted = true; answer = state.live; }
    else if (e.name === "AbortError") error = "A resposta demorou demais. Tente de novo.";
    else if (e instanceof AuthError) { needLogin = true; error = e.message; }
    else error = e.message || "Não foi possível responder agora.";
  } finally {
    clearTimeout(timer);
  }

  state.busy = false;
  state.live = "";
  state.controller = null;

  if (needLogin) {
    toast(error);
    showAuth();
  } else if (answer) {
    conv.messages.push({ role: "ai", text: answer, interrupted });
  } else if (error) {
    conv.messages.push({ role: "err", text: error });
  } else if (!state.stopping) {
    conv.messages.push({ role: "err", text: "Sem resposta do modelo. Tente de novo." });
  }

  conv.updated_at = Date.now();
  sortConversations();
  persist();
  renderAll();
  syncConversation(conv);
}

function stopGeneration() {
  if (!state.busy) return;
  state.stopping = true;
  if (state.controller) state.controller.abort();
}

async function askModel(model, text, history, onPartial, signal) {
  const token = await getAccessToken();
  const base = WORKER_URL + "/gradio/" + encodeURIComponent(model.id) + "/call/" + model.fn;
  const data = [text];

  const post = await fetch(base, {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
    body: JSON.stringify({ data }),
    signal
  });
  if (post.status === 401) throw new AuthError(await readApiError(post));
  if (!post.ok) throw new Error(await readApiError(post));
  const { event_id } = await post.json();

  const res = await fetch(base + "/" + encodeURIComponent(event_id), {
    headers: { Accept: "text/event-stream", Authorization: "Bearer " + token },
    signal
  });
  if (!res.ok) throw new Error(await readApiError(res));

  let latest = "";
  let failure = null;
  await readSSE(res, (event, raw) => {
    if (event === "error") { failure = raw || "Erro no modelo."; return; }
    if (event === "generating" || event === "complete") {
      let value;
      try { value = JSON.parse(raw)[0]; } catch { value = raw; }
      if (typeof value === "string") {
        latest = value.trim();
        onPartial(latest);
      }
    }
  });
  if (failure) throw new Error(failure);
  return latest;
}

async function readSSE(res, onEvent) {
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf("\n\n")) !== -1) {
      const block = buf.slice(0, idx);
      buf = buf.slice(idx + 2);
      let event = "message";
      const data = [];
      for (const line of block.split("\n")) {
        if (line.startsWith("event:")) event = line.slice(6).trim();
        else if (line.startsWith("data:")) data.push(line.slice(5).replace(/^ /, ""));
      }
      onEvent(event, data.join("\n"));
    }
  }
}

const MODELS = [
  { id: "atchk2", name: "Monsei Atchk 2", level: "Melhor", fn: "chat" },
  { id: "cleo", name: "Monsei Cleo 1.1", level: "Intermediário", fn: "chat" },
  { id: "wath", name: "Monsei Wath 1.1", level: "Básico", fn: "chat_wath" }
];

function loadModels() {
  state.models = MODELS;
  const saved = readStore(MODEL_KEY, null);
  state.model = state.models.find((m) => m.id === saved) || state.models[0];
  renderAll();
  renderModelMenu();
}

function chooseModel(id) {
  const m = state.models.find((x) => x.id === id);
  if (!m) return;
  state.model = m;
  writeStore(MODEL_KEY, m.id);
  renderAll();
  renderModelMenu();
  closeMenus();
}

/* ---------- login ---------- */
function sessionFrom(data, email) {
  return {
    access_token: data.access_token,
    refresh_token: data.refresh_token,
    expires_at: Math.floor(Date.now() / 1000) + (data.expires_in || 3600),
    email: (data.user && data.user.email) || email,
    user_id: data.user && data.user.id
  };
}

function saveSession(s) {
  state.session = s;
  if (s) writeStore(SESSION_KEY, s);
  else { try { localStorage.removeItem(SESSION_KEY); } catch {} }
  renderAccount();
}

async function getAccessToken() {
  const s = state.session;
  if (!s) throw new AuthError("Entre na sua conta para conversar.");
  if (s.expires_at - Date.now() / 1000 > 60) return s.access_token;

  const res = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=refresh_token", {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: SUPABASE_KEY },
    body: JSON.stringify({ refresh_token: s.refresh_token })
  });
  if (!res.ok) {
    saveSession(null);
    throw new AuthError("Sua sessão expirou. Entre de novo.");
  }
  const next = sessionFrom(await res.json(), s.email);
  saveSession(next);
  return next.access_token;
}

async function readApiError(res) {
  const body = await res.text().catch(() => "");
  try {
    const j = JSON.parse(body);
    if (j.error) return j.error;
  } catch {}
  return "Erro " + res.status + (body ? ": " + body.slice(0, 200) : "");
}

async function sendCode(email) {
  const check = await fetch(WORKER_URL + "/check-email", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email })
  });
  const info = await check.json().catch(() => ({}));
  if (!check.ok || !info.ok) {
    throw new AuthError(EMAIL_REASONS[info.reason] || "Não foi possível verificar este e-mail.");
  }
  const res = await fetch(SUPABASE_URL + "/auth/v1/otp", {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: SUPABASE_KEY },
    body: JSON.stringify({ email, create_user: true })
  });
  if (!res.ok) throw new AuthError("Não foi possível enviar o código. Tente de novo em instantes.");
}

async function verifyCode(email, token) {
  const res = await fetch(SUPABASE_URL + "/auth/v1/verify", {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: SUPABASE_KEY },
    body: JSON.stringify({ email, token, type: "email" })
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok || !data.access_token) throw new AuthError("Código inválido ou expirado.");
  saveSession(sessionFrom(data, email));
}

function showAuth() {
  $("auth").classList.add("open");
  showEmailStep();
}
function hideAuth() { $("auth").classList.remove("open"); }
function showEmailStep() {
  $("emailForm").hidden = false;
  $("codeForm").hidden = true;
  $("authHint").textContent = "Digite seu e-mail. Enviaremos um código de 6 dígitos.";
  setAuthError("");
}
function showCodeStep() {
  $("emailForm").hidden = true;
  $("codeForm").hidden = false;
  $("authHint").textContent = "Digite o código de 6 dígitos que enviamos para " + state.pendingEmail + ".";
  $("authCode").value = "";
  $("authCode").focus();
}
function setAuthError(msg) { $("authError").textContent = msg || ""; }
function setAuthBusy(busy) {
  document.querySelectorAll("#auth button, #auth input").forEach((el) => { el.disabled = busy; });
}

function logout() {
  saveSession(null);
  state.conversations = [];
  state.currentId = null;
  newConversation();
  persist();
  renderAll();
  toast("Você saiu da conta.");
}

/* ---------- histórico na nuvem (Supabase) ---------- */
async function pullRemote() {
  try {
    const token = await getAccessToken();
    const res = await fetch(
      SUPABASE_URL + "/rest/v1/conversations?select=id,title,messages,updated_at&order=updated_at.desc",
      { headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + token } }
    );
    if (!res.ok) return;
    const rows = await res.json();

    const byId = new Map(state.conversations.map((c) => [c.id, c]));
    rows.forEach((row) => {
      const remote = { id: row.id, title: row.title || "Nova conversa", messages: row.messages || [], updated_at: Date.parse(row.updated_at) || 0 };
      const local = byId.get(row.id);
      if (!local) state.conversations.push(remote);
      else if (remote.updated_at > local.updated_at) Object.assign(local, remote);
    });

    const remoteIds = new Set(rows.map((r) => r.id));
    state.conversations
      .filter((c) => !remoteIds.has(c.id) && c.messages.length)
      .forEach((c) => syncConversation(c));

    if (!state.conversations.find((c) => c.id === state.currentId)) state.currentId = null;
    if (!state.conversations.length) newConversation();
    sortConversations();
    if (!state.currentId) state.currentId = state.conversations[0].id;
    persist();
    renderAll();
  } catch (e) {
    console.warn("Sincronização:", e);
  }
}

async function syncConversation(conv) {
  if (!state.session || !conv.messages.length) return;
  try {
    const token = await getAccessToken();
    const row = {
      id: conv.id,
      user_id: state.session.user_id,
      title: conv.title,
      messages: conv.messages,
      updated_at: new Date(conv.updated_at).toISOString()
    };
    const res = await fetch(SUPABASE_URL + "/rest/v1/conversations?on_conflict=user_id,id", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        apikey: SUPABASE_KEY,
        Authorization: "Bearer " + token,
        Prefer: "resolution=merge-duplicates"
      },
      body: JSON.stringify([row])
    });
    if (!res.ok) console.warn("Sync falhou:", await readApiError(res));
  } catch (e) {
    console.warn("Sync:", e);
  }
}

async function deleteRemote(id) {
  if (!state.session) return;
  try {
    const token = await getAccessToken();
    await fetch(SUPABASE_URL + "/rest/v1/conversations?id=eq." + encodeURIComponent(id), {
      method: "DELETE",
      headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + token }
    });
  } catch (e) {
    console.warn("Excluir na nuvem:", e);
  }
}

/* ---------- ações da conversa ---------- */
function openConv(id) {
  if (state.busy) { toast("Aguarde a resposta terminar."); return; }
  state.currentId = id;
  persist();
  openSidebar(false);
  renderAll();
}

function newChat() {
  if (state.busy) { toast("Aguarde a resposta terminar."); return; }
  const current = state.conversations.find((c) => c.id === state.currentId);
  if (current && !current.messages.length) {
    openSidebar(false);
    $("input").focus();
    return;
  }
  newConversation();
  persist();
  openSidebar(false);
  renderAll();
  $("input").focus();
}

function deleteConv(id) {
  if (state.busy && id === state.currentId) { toast("Aguarde a resposta terminar."); return; }
  if (!confirm("Excluir esta conversa?")) return;
  state.conversations = state.conversations.filter((c) => c.id !== id);
  if (!state.conversations.length) newConversation();
  if (state.currentId === id) state.currentId = state.conversations[0].id;
  persist();
  deleteRemote(id);
  renderAll();
}

function toMarkdown(conv) {
  const lines = ["# " + conv.title, ""];
  conv.messages.forEach((m) => {
    const who = m.role === "user" ? "Você" : m.role === "ai" ? "Monsei" : "Erro";
    lines.push("**" + who + ":**", "", m.text, "");
  });
  return lines.join("\n");
}

function downloadFile(name, content, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function exportConversation(kind) {
  const conv = currentConv();
  const safe = (conv.title || "conversa").replace(/[^\w\- ]+/g, "").trim().replace(/\s+/g, "-") || "conversa";
  if (kind === "md") downloadFile(safe + ".md", toMarkdown(conv), "text/markdown");
  else downloadFile(safe + ".json", JSON.stringify(conv, null, 2), "application/json");
}

function copyText(text, btn, doneLabel) {
  const done = () => {
    if (!btn) return toast("Copiado");
    const old = btn.textContent;
    btn.textContent = doneLabel || "Copiado!";
    setTimeout(() => { btn.textContent = old; }, 1400);
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, done) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); done(); } catch { toast("Não foi possível copiar."); }
  ta.remove();
}

function reportMessage(idx) {
  if (!REPORT_EMAIL) { toast("Denúncias ainda não estão configuradas."); return; }
  const conv = currentConv();
  const msg = conv.messages[idx];
  const body = "Mensagem denunciada:\n\n" + (msg ? msg.text : "") + "\n\nModelo: " + (state.model ? state.model.name : "");
  location.href = "mailto:" + REPORT_EMAIL +
    "?subject=" + encodeURIComponent("Denúncia de resposta - Monsei") +
    "&body=" + encodeURIComponent(body);
}

/* ---------- eventos ---------- */
function bindEvents() {
  $("menuBtn").addEventListener("click", () => openSidebar(true));
  $("scrim").addEventListener("click", () => openSidebar(false));
  $("newBtn").addEventListener("click", newChat);
  $("search").addEventListener("input", (e) => { state.search = e.target.value; renderList(); });

  $("convList").addEventListener("click", (e) => {
    const del = e.target.closest("[data-del]");
    if (del) { deleteConv(del.dataset.del); return; }
    const open = e.target.closest("[data-open]");
    if (open) openConv(open.dataset.open);
  });

  $("modelBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    const menu = $("modelMenu");
    const willOpen = menu.hidden;
    closeMenus();
    menu.hidden = !willOpen;
    $("modelBtn").setAttribute("aria-expanded", String(willOpen));
    if (willOpen) renderModelMenu();
  });
  $("modelMenu").addEventListener("click", (e) => {
    const b = e.target.closest("[data-model]");
    if (b) chooseModel(b.dataset.model);
  });

  $("moreBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    const menu = $("moreMenu");
    const willOpen = menu.hidden;
    closeMenus();
    menu.hidden = !willOpen;
  });
  $("moreMenu").addEventListener("click", (e) => {
    const b = e.target.closest("[data-more]");
    if (!b) return;
    closeMenus();
    const kind = b.dataset.more;
    if (kind === "copy") copyText(toMarkdown(currentConv()), null, "Copiado");
    if (kind === "md" || kind === "json") exportConversation(kind);
    if (kind === "delete") deleteConv(state.currentId);
  });
  document.addEventListener("click", (e) => {
    if (!e.target.closest(".menu") && !e.target.closest("#modelBtn") && !e.target.closest("#moreBtn")) closeMenus();
  });

  $("chatInner").addEventListener("click", (e) => {
    const chip = e.target.closest("[data-chip]");
    if (chip) {
      $("input").value = chip.dataset.chip;
      autoGrow();
      $("input").focus();
      return;
    }
    const copy = e.target.closest(".copy-btn");
    if (copy) { copyText(decodeURIComponent(copy.dataset.copy), copy, "Copiado!"); return; }
    const act = e.target.closest("[data-act]");
    if (!act) return;
    const idx = Number(act.dataset.idx);
    if (act.dataset.act === "copy") {
      const m = currentConv().messages[idx];
      if (m) copyText(m.text, act, "Copiado!");
    } else if (act.dataset.act === "regen") {
      regenerate();
    } else if (act.dataset.act === "report") {
      reportMessage(idx);
    }
  });

  const input = $("input");
  input.addEventListener("input", autoGrow);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      sendMessage();
    }
  });
  $("sendBtn").addEventListener("click", () => {
    if (state.busy) stopGeneration();
    else sendMessage();
  });

  $("account").addEventListener("click", (e) => {
    const b = e.target.closest("[data-account]");
    if (!b) return;
    if (b.dataset.account === "login") showAuth();
    if (b.dataset.account === "logout") logout();
  });
  $("reportLink").addEventListener("click", (e) => {
    e.preventDefault();
    if (!REPORT_EMAIL) toast("Denúncias ainda não estão configuradas.");
    else location.href = "mailto:" + REPORT_EMAIL + "?subject=" + encodeURIComponent("Problema no Monsei");
  });

  $("emailForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = $("authEmail").value.trim();
    setAuthError("");
    setAuthBusy(true);
    try {
      await sendCode(email);
      state.pendingEmail = email;
      showCodeStep();
    } catch (err) {
      setAuthError(err.message || "Não foi possível enviar o código.");
    } finally {
      setAuthBusy(false);
    }
  });
  $("codeForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    setAuthError("");
    setAuthBusy(true);
    try {
      await verifyCode(state.pendingEmail, $("authCode").value.trim());
      hideAuth();
      toast("Conectado!");
      await pullRemote();
    } catch (err) {
      setAuthError(err.message || "Código inválido.");
    } finally {
      setAuthBusy(false);
    }
  });
  $("changeEmailBtn").addEventListener("click", showEmailStep);
  $("authClose").addEventListener("click", hideAuth);
  $("auth").addEventListener("click", (e) => { if (e.target === $("auth")) hideAuth(); });

  document.addEventListener("keydown", (e) => {
    const mod = e.ctrlKey || e.metaKey;
    if (mod && e.key.toLowerCase() === "k") { e.preventDefault(); newChat(); }
    if (mod && e.key === "/") { e.preventDefault(); $("input").focus(); }
    if (e.key === "Escape") {
      if ($("auth").classList.contains("open")) hideAuth();
      else if ($("sidebar").classList.contains("open")) openSidebar(false);
      else if (state.busy) stopGeneration();
      closeMenus();
    }
  });
}

/* ---------- início ---------- */
function init() {
  state.conversations = readStore(CONV_KEY, []);
  state.currentId = readStore(CUR_KEY, null);
  state.session = readStore(SESSION_KEY, null);
  if (state.session && !state.session.access_token) state.session = null;

  if (!state.conversations.find((c) => c.id === state.currentId)) {
    state.currentId = state.conversations.length ? state.conversations[0].id : null;
  }
  if (!state.currentId) newConversation();
  sortConversations();

  bindEvents();
  renderAll();
  loadModels();

  if (state.session) {
    pullRemote();
  } else {
    setTimeout(showAuth, 600);
  }
  autoGrow();
}

init();

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch((err) => console.warn("SW:", err));
  });
}
</script>
